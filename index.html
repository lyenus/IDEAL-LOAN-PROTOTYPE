function seedV2(){const x=seed();x.version=2;x.role='Customer';x.company={...x.company,contingency:0,workingCapital:0,bufferReason:'',amountReason:'',lat:1.3521,lon:103.8198,location:'Singapore',locationPrecision:'Country centre'};x.deps=x.deps.map((d,i)=>({...d,lat:i?1.30:1.49,lon:i?103.85:103.74,alias:'',bankReviewed:false,locationPrecision:'Declared site'}));x.events=[];x.status='Draft';x.statusHistory=[{status:'Draft',time:new Date().toISOString(),message:'Application started'}];x.message='';x.analystNote='';x.confirmed=false;x.monitor={enabled:false,lastRun:'',error:'',count:0,mode:'Public news',lastAttempt:''};x.connection={url:''};x.benchmarks=[];x.audit=[];return x;}
function validateV2(x){if(!x||x.version!==2||!x.company||!Array.isArray(x.financials)||!x.financials.length||x.financials.length>10||!Array.isArray(x.deps)||x.deps.length>100||!Array.isArray(x.events)||x.events.length>500)throw Error('Choose a version 2 workspace export.');const b=seedV2();for(const k of ['project','equityFunding','availableFacility','requested','contingency','workingCapital'])if(!finite(x.company[k])||x.company[k]<0)throw Error('Invalid company funding values.');x.financials.forEach(f=>{if(!/^\d{4}$/.test(String(f.year)))throw Error('Invalid reporting year.');for(const k of Object.keys(FIELDS))if(f[k]!==null&&!finite(f[k]))throw Error('Invalid financial value '+k);});for(const k of ['terms','scenario','cov']){if(!x[k])throw Error('Missing '+k);for(const [key,v]of Object.entries(b[k]))if(typeof v==='number'&&(!finite(x[k][key])||x[k][key]<0||x[k][key]>1e12))throw Error('Invalid '+k+' '+key);}if(x.terms.years<1||x.terms.years>15||x.terms.rate>30||x.terms.grace>=x.terms.years*12)throw Error('Invalid loan terms.');for(const k of ['replacement','recovery','revenueShare','margin'])if(x.scenario[k]>100)throw Error('Invalid percentage');const depIds=new Set();x.deps.forEach(d=>{if(!d.id||depIds.has(d.id)||!['Supplier','Customer'].includes(d.kind)||!d.name)throw Error('Invalid dependency');depIds.add(d.id);for(const k of ['share','inventory','alternatives','terms'])if(!finite(d[k])||d[k]<0)throw Error('Invalid dependency figures');if(d.share>100||d.inventory>104)throw Error('Invalid dependency percentage or inventory');if(d.lat!==null&&(!finite(d.lat)||Math.abs(d.lat)>90))throw Error('Invalid latitude');if(d.lon!==null&&(!finite(d.lon)||Math.abs(d.lon)>180))throw Error('Invalid longitude');});x.role=['Customer','Analyst'].includes(x.role)?x.role:'Customer';x.monitor={...b.monitor,...x.monitor,enabled:false};x.connection={url:safeURL(x.connection?.url)||''};x.status=STAGES.includes(x.status)?x.status:'Draft';x.statusHistory=Array.isArray(x.statusHistory)?x.statusHistory.slice(-100):[];x.docs=Array.isArray(x.docs)?x.docs.slice(0,100):[];x.audit=Array.isArray(x.audit)?x.audit.slice(0,200):[];x.benchmarks=Array.isArray(x.benchmarks)?x.benchmarks:[];return x;}
const finite=v=>typeof v==='number'&&Number.isFinite(v);
function known(...v){return v.every(finite);}
function ratio(a,b){return known(a,b)&&b>0?a/b:null;}
function displayMoney(n,compact=false){return finite(n)?money(n,compact):'Not available';}
function gap(){return Math.max(0,S.company.project+S.company.contingency+S.company.workingCapital-S.company.equityFunding-(S.company.facilityConfirmed?S.company.availableFacility:0));}
function fundingDifference(){return S.company.requested-gap();}
function actor(){return S.role==='Analyst'?'DBS analyst':'Company finance team';}
function canEdit(){return true;}
function requireAnalyst(){if(S.role!=='Analyst'){toast('This action belongs to the analyst workspace.');return false;}return true;}
function readyForModel(){const f=latest();return known(f.revenue,f.cfads,f.debtService,S.scenario.openingCash);}
function sortedFinancials(){S.financials.sort((a,b)=>Number(a.year)-Number(b.year));}
function healthRatios(f){return [['Gross margin',ratio(f.grossProfit,f.revenue),'pct'],['Net margin',ratio(f.netIncome,f.revenue),'pct'],['Current ratio',ratio(f.currentAssets,f.currentLiabilities),'x'],['Quick ratio',known(f.currentAssets,f.inventory)?ratio(f.currentAssets-f.inventory,f.currentLiabilities):null,'x'],['Debt to equity',ratio(f.debt,f.equity),'x'],['EBITDA interest cover',ratio(f.ebitda,f.interest),'x'],['Debt service coverage',ratio(f.cfads,f.debtService),'x'],['Operating cash flow to debt',ratio(f.cfo,f.debt),'x'],['Receivables turnover proxy',ratio(f.revenue,f.receivables),'x'],['Receivable days proxy',known(f.revenue,f.receivables)&&f.revenue>0?f.receivables/f.revenue*365:null,'days']];}
function ratioText(v,type){return type==='pct'?percent(v):type==='days'?(v===null?'N/A':v.toFixed(1)+' days'):times(v);}
function checklist(){const f=latest();return [{key:'purpose',label:'Enter the financing purpose and project budget',done:!!S.company.purpose.trim()&&S.company.project>0},{key:'financial',label:'Review imported financial figures and source references',done:S.confirmed&&known(f.revenue)},{key:'funding',label:'Explain the difference between the funding requirement and requested amount',done:Math.abs(fundingDifference())<1||!!S.company.amountReason.trim()},{key:'dependencies',label:'Confirm critical supplier and customer declarations',done:S.deps.length>0&&S.deps.every(d=>d.confirmed)},{key:'coverage',label:'Enter CFADS and existing debt service for repayment assessment',done:readyForModel()}];}
function unresolved(){const a=checklist().filter(c=>!c.done).map(c=>c.label);if(S.company.contingency+S.company.workingCapital>0&&!S.company.bufferReason.trim())a.push('Explain the contingency and working-capital allowances');if(S.deps.some(d=>!finite(d.lat)||!finite(d.lon)))a.push('Set locations for unmapped counterparties');if(S.role==='Analyst'&&S.deps.some(d=>!d.bankReviewed))a.push('Complete bank review of declared dependencies');return a;}
function tracker(){const stageIndex={Draft:0,Submitted:1,'Under assessment':2,'Information requested':2,'Offer issued':3,'Offer accepted':4,Disbursed:5}[S.status]??0;return `<div class="tracker">${['Prepare','Submitted','Assessment','Offer','Accepted','Disbursed'].map((s,i)=>`<div class="${i<=stageIndex?'done':''}"><span>${i<stageIndex?'✓':i+1}</span>${s}</div>`).join('')}</div><p class="statusline"><span class="tag ${S.status==='Information requested'?'amber':'red'}">${E(S.status)}</span>${S.message?`<span>${E(S.message)}</span>`:''}</p>`;}
function metricRow(){const m=readyForModel()?model():null;return `<div class="grid four metrics">${kpi('Requested financing',money(S.company.requested,true),E(S.terms.product))}${kpi('Funding requirement',money(gap(),true),'Includes entered allowances')}${kpi('Mapped relationships',S.deps.filter(d=>known(d.lat,d.lon)).length+' / '+S.deps.length,'Suppliers and customers')}${kpi(S.role==='Analyst'?'Events awaiting assessment':'Business alerts',S.events.filter(e=>!['Dismissed','Closed'].includes(e.status)).length,m?'Scenario coverage '+times(m.stressDSCR):'Monitoring workspace')}</div>`;}
function countryField(label,key,value){return `<label class="field">${label}<input name="${key}" value="${E(value)}" list="countries" required maxlength="80"></label>`;}
function countryList(){return `<datalist id="countries">${Object.keys(COUNTRY_POINTS).sort().map(k=>`<option>${E(k)}</option>`).join('')}</datalist>`;}
function workbookStats(){const f=latest();return `<div class="tablewrap"><table><thead><tr><th>Measure</th>${S.financials.map(y=>`<th class="num">${E(y.year)}</th>`).join('')}</tr></thead><tbody>${['revenue','grossProfit','netIncome','cfo'].map(k=>`<tr><td>${FIELDS[k]}</td>${S.financials.map(y=>`<td class="num">${displayMoney(y[k],true)}</td>`).join('')}</tr>`).join('')}${healthRatios(f).map(([label,v,type],i)=>`<tr><td>${label}</td>${S.financials.map(y=>`<td class="num">${ratioText(healthRatios(y)[i][1],type)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function documentsV2(){return head('',S.role==='Analyst'?'Financial review':'Financial documents','Upload an Excel workbook, review extracted figures and retain the source references.')+`<div class="grid equal"><section class="card"><h2>Import company financials</h2><p class="small">Reads .xlsx and CSV files locally. Recognises common statement labels and year columns across worksheets.</p><label class="field">Choose a workbook<input id="workbookFile" type="file" accept=".xlsx,.csv"></label><div class="row" style="margin-top:15px">${button('Download Excel template','workbookTemplate')}${button('Import a peer workbook','peerImport')}</div><input id="peerFile" type="file" accept=".xlsx,.csv" hidden><p class="tiny muted">Workbook formatting varies. Review unmatched fields, reporting years, currency and units before applying. Formula cells require saved cached values.</p></section><section class="card"><div class="row between"><h2>Data review</h2><span class="tag ${S.confirmed?'green':'amber'}">${S.confirmed?'Company confirmed':'Review required'}</span></div><p class="small">${S.financials.length} reporting periods · latest ${E(latest().year)}</p><p class="tiny muted">${E(latest().source||'Source pending')} · ${E(latest().asof||'Date pending')}</p>${button('Confirm reviewed financials','confirmFinancials',true)}<p class="tiny muted">Confirmation records your review of the figures. It does not independently verify the document.</p></section></div>${stageImport?renderImportReview():''}<section class="card" style="margin-top:20px"><h2>Financial overview</h2>${workbookStats()}<p class="tiny muted">N/A means unavailable or unsuitable denominator. Receivables measures use closing balances. CFADS is cash available before debt service, not automatically operating cash flow.</p></section><section class="card"><div class="row between"><h2>Review inputs</h2><label class="small">Period <select id="finPeriod">${S.financials.map((f,i)=>`<option value="${i}" ${i===Math.min(finIndex,S.financials.length-1)?'selected':''}>${E(f.year)}</option>`).join('')}</select></label></div><form id="financialV2"><div class="forms">${financialFields(S.financials[Math.min(finIndex,S.financials.length-1)])}</div><button class="primary" style="margin-top:18px">Save financial inputs</button></form></section><section class="card"><h2>Peer comparison</h2>${S.benchmarks.length?`<div class="tablewrap"><table><thead><tr><th>Company / source</th><th>Period</th><th>Gross margin</th><th>Current ratio</th><th>Debt to equity</th></tr></thead><tbody><tr><td>${E(S.company.name)}</td><td>${E(latest().year)}</td><td>${percent(ratio(latest().grossProfit,latest().revenue))}</td><td>${times(ratio(latest().currentAssets,latest().currentLiabilities))}</td><td>${times(ratio(latest().debt,latest().equity))}</td></tr>${S.benchmarks.map(b=>`<tr><td>${E(b.name)}<br><span class="tiny muted">${E(b.source)}</span></td><td>${E(b.year)}</td><td>${percent(b.gross)}</td><td>${times(b.current)}</td><td>${times(b.de)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Import a comparable company workbook. Ratios are calculated from its figures, with source references, rather than guessed benchmark values.</p>'}<p class="tiny muted">Match business model, period and accounting definitions. Do not force a gross-margin comparison where gross profit is not reported.</p>${button('Import peer financials','peerImport')}</section>`;}
function financialFields(f){return field('Reporting year','year',f.year,'text','required pattern="[0-9]{4}"')+field('Source document','source',f.source||'','text','required maxlength="500"')+Object.entries(FIELDS).map(([k,l])=>field(l+' · SGD',k,f[k]??'','number','step="any" max="1000000000000"',f.refs?.[k]||'')).join('')+field('Financial as-of date','asof',f.asof||today(),'date','required');}
function blankFinancial(year,source){return {year:String(year),...Object.fromEntries(Object.keys(FIELDS).map(k=>[k,null])),source,page:'',asof:today(),refs:{}};}
const ALIASES={revenue:['revenue','total revenue','sales','total sales','net sales','turnover','operating revenue'],grossProfit:['gross profit','gross income'],netIncome:['net income','net profit','net profit after tax','profit after tax','profit for the year','profit for the financial year','profit attributable to owners of the company'],ebitda:['ebitda','earnings before interest tax depreciation and amortisation','earnings before interest taxes depreciation and amortization'],interest:['interest expense','interest expenses','finance costs','finance cost','interest paid'],currentAssets:['current assets','total current assets'],inventory:['inventories','inventory','total inventories'],currentLiabilities:['current liabilities','total current liabilities'],debt:['interest bearing debt','interest-bearing debt','total debt','total borrowings','borrowings'],equity:['total equity','total shareholders equity','shareholders equity','equity attributable to owners of the company'],cash:['cash','reported cash','cash and cash equivalents','cash & cash equivalents'],cfo:['operating cash flow','cash flow from operations','net cash from operating activities','net cash generated from operating activities','net cash provided by operating activities'],cfads:['cfads','cash available for debt service','cash flow available for debt service'],debtService:['existing annual principal and interest','annual debt service','debt service','existing debt service'],receivables:['trade receivables','accounts receivable','trade and other receivables','receivables']};
function norm(s){return String(s??'').toLowerCase().replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();}
function matchField(label){const n=norm(label);if(!n||/margin|ratio|per share|growth|change|percent/.test(n))return null;for(const [k,list]of Object.entries(ALIASES))if(list.some(a=>norm(a)===n)||norm(k)===n)return k;return null;}
function numberCell(v){if(typeof v==='number')return Number.isFinite(v)?v:null;if(v===null||v===undefined)return null;let s=String(v).trim();if(!s||/^[-–—]$/.test(s)||/%/.test(s))return null;const negative=/^\(.*\)$/.test(s);s=s.replace(/[,$£€¥\s]/g,'').replace(/^S\$/,'').replace(/^\(/,'').replace(/\)$/,'');if(!/^-?\d+(\.\d+)?$/.test(s))return null;return Number(s)*(negative?-1:1);}
function extractYear(v){if(typeof v==='number'&&v>=1900&&v<=2100&&Number.isInteger(v))return String(v);const m=String(v??'').match(/(?:^|\D)((?:19|20)\d{2})(?:\D|$)/);return m?m[1]:null;}
function extractWorkbook(wb,fileName){const years=new Map(),matches=[],warnings=[];let unit=1,currency='Unknown';const context=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null}).slice(0,15).map(r=>r.join(' ')).join(' ')).join(' ').toLowerCase();if(/million|\bsgd m\b|\bs\$m\b|\$ million/.test(context))unit=1000000;else if(/thousand|000s|\$\s*['’]?000|sgd\s*['’]?000|in 000/.test(context))unit=1000;if(/\bsgd\b|singapore dollars|s\$/.test(context))currency='SGD';else if(/\busd\b|us dollars|us\$/.test(context))currency='USD';const put=(year,k,value,ref)=>{if(value===null)return;const f=years.get(year)||blankFinancial(year,fileName);if(f[k]!==null&&Math.abs(f[k]-value)>1e-7){warnings.push('Multiple '+FIELDS[k]+' values for '+year+'; first match retained. Check '+ref);return;}f[k]=value;f.refs[k]=ref;years.set(year,f);matches.push({year,k,raw:value,ref});};for(const name of wb.SheetNames){const sheet=wb.Sheets[name];if(!sheet||!sheet['!ref'])continue;const range=XLSX.utils.decode_range(sheet['!ref']);if(range.e.r-range.s.r>20000||range.e.c-range.s.c>300){warnings.push(name+': large sheet skipped');continue;}const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,blankrows:true,range:0});for(let ri=0;ri<Math.min(rows.length,20000);ri++){const row=rows[ri]||[];const ycols=row.map((v,c)=>({year:extractYear(v),c})).filter(x=>x.year);if(ycols.length>=1){for(let r=ri+1;r<Math.min(rows.length,ri+350);r++){const data=rows[r]||[];let k=null;for(let c=0;c<Math.min(ycols[0].c,6);c++){k=matchField(data[c]);if(k)break;}if(!k)continue;for(const yc of ycols)put(yc.year,k,numberCell(data[yc.c]),name+'!'+XLSX.utils.encode_cell({r,c:yc.c}));}}const cols=row.map(v=>matchField(v));if(cols.filter(Boolean).length>=2){const yearCol=row.findIndex(v=>/^(year|period|reporting year|financial year)$/i.test(String(v??'').trim()));if(yearCol>=0){for(let r=ri+1;r<Math.min(rows.length,ri+30);r++){const data=rows[r]||[],year=extractYear(data[yearCol]);if(!year)continue;cols.forEach((k,c)=>{if(k)put(year,k,numberCell(data[c]),name+'!'+XLSX.utils.encode_cell({r,c}));});}}}}}
if(!years.size)throw Error('No financial years and recognised statement labels found. Use the Excel template or rename labels to standard financial terms.');const list=[...years.values()].sort((a,b)=>Number(a.year)-Number(b.year)).slice(-3);if(currency==='Unknown')warnings.push('Currency not detected. Confirm SGD or convert outside the prototype before applying.');if(unit!==1)warnings.push('Detected units: '+(unit===1000?'thousands':'millions')+'. Confirm the multiplier.');warnings.push('Review all extracted values. Missing CFADS, debt service and EBITDA are left blank; they are not inferred.');return{rows:list,unit,currency,warnings:[...new Set(warnings)].slice(0,15),fileName,matches:matches.length};}
function renderImportReview(){const st=stageImport;return `<section class="card import-review" style="margin-top:20px"><div class="row between"><h2>Review extracted ${st.target==='peer'?'peer':'company'} figures</h2><span class="tag green">${st.matches} matched cells</span></div><p class="small">${E(st.fileName)} · ${st.rows.map(r=>E(r.year)).join(', ')}</p><form id="applyImport"><div class="forms">${field(st.target==='peer'?'Peer company name':'Source company name','name',st.target==='peer'?'':S.company.name,'text','required maxlength="150"')}${select('Source currency','currency',['SGD','USD','Other'],st.currency==='SGD'?'SGD':st.currency==='USD'?'USD':'Other')}<label class="field">Amounts in workbook<select name="multiplier"><option value="1" ${st.unit===1?'selected':''}>Whole currency units</option><option value="1000" ${st.unit===1000?'selected':''}>Thousands</option><option value="1000000" ${st.unit===1000000?'selected':''}>Millions</option></select></label>${field('Financial as-of date','asof',today(),'date','required')}</div><ul class="small list">${st.warnings.map(w=>`<li>${E(w)}</li>`).join('')}</ul><div class="tablewrap"><table><thead><tr><th>Field</th>${st.rows.map(f=>`<th>${E(f.year)} · raw workbook value</th>`).join('')}</tr></thead><tbody>${Object.entries(FIELDS).map(([k,label])=>`<tr><td>${label}</td>${st.rows.map((f,i)=>`<td><input class="import-number" aria-label="${E(label+' '+f.year)}" type="number" step="any" name="${i}_${k}" value="${f[k]??''}"><span class="tiny muted">${E(f.refs[k]||'Not found')}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="row"><button class="primary">Apply reviewed figures</button>${button('Cancel import','cancelImport')}</div></form></section>`;}
function exposureV2(){const d=S.deps.find(d=>d.id===editDep)||{name:'',alias:'',kind:'Supplier',country:'Singapore',site:'',item:'',share:0,critical:'High',inventory:0,alternatives:0,terms:30,confirmed:false,lat:null,lon:null};return head('',S.role==='Analyst'?'Exposure network':'Business exposure','Declared supplier and customer dependencies, linked to operating locations.')+`<section class="card"><div class="row between"><h2>Geographic exposure</h2><div class="row">${['Global','Regional','National'].map(s=>button(s,'mapScope:'+s,mapScope===s)).join('')}</div></div><div id="exposureMap" class="map"></div><p class="tiny muted">Red: supplier · blue: customer · dark: borrower. Select a company for details. Country-centre markers are approximate; they do not identify a specific factory.</p><div id="mapSelection">${selectedDep?dependencyDetail(S.deps.find(d=>d.id===selectedDep)):''}</div></section><section class="card"><div class="row between"><h2>Declared relationships</h2>${button('Add a relationship','newDep',true)}</div><div class="tablewrap"><table><thead><tr><th>Counterparty</th><th>Dependency</th><th>Concentration</th><th>Company confirmation</th>${S.role==='Analyst'?'<th>Bank review</th>':''}<th>Action</th></tr></thead><tbody>${S.deps.map(x=>`<tr><td><strong>${E(x.name)}</strong><br><span class="tiny muted">${E(x.kind)} · ${E(x.country)}</span></td><td>${E(x.item)}<br><span class="tiny muted">${E(x.site)}</span></td><td>${x.share}% of ${x.kind==='Supplier'?'procurement':'sales'}</td><td><span class="tag ${x.confirmed?'green':'amber'}">${x.confirmed?'Confirmed':'Pending confirmation'}</span></td>${S.role==='Analyst'?`<td><span class="tag ${x.bankReviewed?'green':'amber'}">${x.bankReviewed?'Reviewed':'Not reviewed'}</span><br><button class="linkbtn" data-action="bankConfirm:${E(x.id)}">Mark reviewed</button></td>`:''}<td><button class="linkbtn" data-action="editDep:${E(x.id)}">Edit</button><br><button class="linkbtn" data-action="deleteDep:${E(x.id)}">Remove</button></td></tr>`).join('')||'<tr><td colspan="6">Add a supplier or customer to map the exposure.</td></tr>'}</tbody></table></div></section><section class="card" id="depEditor"><h2>${editDep?'Edit relationship':'Add relationship'}</h2><form id="dependencyV2"><div class="forms">${field('Legal company name','name',d.name,'text','required maxlength="150"')}${field('Public trading name / news alias','alias',d.alias||'','text','maxlength="150"')}${select('Relationship','kind',['Supplier','Customer'],d.kind)}${countryField('Country','country',d.country)}${field('Site / subsidiary / contract','site',d.site,'text','required maxlength="200"')}${field('Product or service dependency','item',d.item,'text','required maxlength="300"')}${field('Share of procurement / sales %','share',d.share,'number','required min="0" max="100" step="any"')}${select('Operational criticality','critical',['High','Medium','Low'],d.critical)}${field('Inventory · weeks (supplier)','inventory',d.inventory,'number','required min="0" max="104" step="any"')}${field('Replacement lead time · weeks','alternatives',d.alternatives,'number','required min="0" max="104" step="any"')}${field('Payment terms · days','terms',d.terms,'number','required min="0" max="730" step="1"')}${field('Latitude (optional)','lat',d.lat??'','number','min="-90" max="90" step="any"')}${field('Longitude (optional)','lon',d.lon??'','number','min="-180" max="180" step="any"')}</div><label class="check"><input type="checkbox" name="confirmed" ${d.confirmed?'checked':''}>The company confirms this relationship and its dependency details.</label><p class="tiny muted">Coordinates override country centres. A public alias improves exact-name news searches. No private financial information is sent to the news provider.</p><button class="primary">${editDep?'Save relationship':'Add relationship'}</button>${countryList()}</form></section>`;}
function dependencyDetail(d){if(!d)return '';const events=S.events.filter(e=>e.dep===d.id&&!['Dismissed','Closed'].includes(e.status));return `<div class="mapdetail"><strong>${E(d.name)}</strong><p class="small">${E(d.item)} · ${d.share}% concentration · ${E(d.critical)} criticality</p><p class="tiny muted">${E(d.site)} · ${E(d.locationPrecision||'Country centre')} · ${events.length} active signals</p><div class="row">${button('Review related alerts','filterDep:'+d.id)}${button('Edit location','editDep:'+d.id)}</div></div>`;}
let alertFilter='';
function eventTransmission(e,d){if(e.aiExplanation)return e.aiExplanation;if(!d)return 'The declared relationship requires review.';if(e.type==='Supplier disruption')return 'A delivery or operating interruption could affect '+d.item.toLowerCase()+'. Check available inventory, replacement lead time and whether the reported operation supplies this contract.';if(e.type==='Customer payment delay')return 'Delayed collections from this customer could temporarily reduce cash available for debt service. Confirm the invoice value, due date and additional delay.';if(e.type==='Cost increase')return 'The reported development may change the cost of '+d.item.toLowerCase()+'. Establish the affected cost base and any customer reimbursement before estimating an amount.';return 'Review whether this development changes the specific contract, supply continuity or payment relationship. A headline alone does not establish an adverse borrower impact.';}
function alertsV2(){const list=S.events.filter(e=>(!alertFilter||e.dep===alertFilter)&&(S.role==='Analyst'||e.status!=='Dismissed'));return head('',S.role==='Analyst'?'Counterparty monitoring':'Business risk alerts','Relevant developments linked to declared business dependencies.',button(monitorBusy?'Scanning…':'Scan public news','scan',true,monitorBusy?'disabled':''))+`<section class="card"><div class="row between"><div><h2>Monitoring</h2><p class="small muted">${S.monitor.lastRun?'Last successful scan: '+E(new Date(S.monitor.lastRun).toLocaleString('en-SG')):'No successful live scan yet.'} · ${S.connection.url?'Monitoring service configured':'Public feed with keyword triage'}</p></div><label class="check"><input id="monitorToggle" type="checkbox" ${S.monitor.enabled?'checked':''}>Refresh every 10 minutes while this page is open</label></div>${S.monitor.error?`<div class="notice">${E(S.monitor.error)} Existing evidence is retained.</div>`:''}<p class="tiny muted">Scans cover up to eight confirmed counterparties, using their public names or aliases. Results are possible matches and need source review. No results does not establish low risk.</p>${alertFilter?`<div class="row"><span class="tag">Filtered relationship</span>${button('Clear filter','clearAlertFilter')}</div>`:''}</section>${list.length?list.map(e=>renderEvent(e)).join(''):'<section class="card empty"><h2>No matching events recorded</h2><p>Run a live scan or add sourced evidence below.</p></section>'}<section class="card"><details><summary>Add an announcement or report manually</summary><form id="evidenceV2"><div class="forms"><label class="field">Declared counterparty<select name="dep" required>${S.deps.map(d=>`<option value="${E(d.id)}">${E(d.name)}</option>`).join('')}</select></label>${select('Event category','type',['Supplier disruption','Customer payment delay','Cost increase','Corporate action','General development'],'Supplier disruption')}${field('Title','title','','text','required maxlength="300"')}${field('Source URL','url','','url','required maxlength="1000"')}${field('Publication date','date',today(),'date','required')}${field('Source publisher','source','','text','required maxlength="150"')}${textarea('Relevant evidence extract','text','','required maxlength="3000"')}</div><button class="primary">Add evidence</button></form></details></section>`;}
function renderEvent(e){const d=S.deps.find(d=>d.id===e.dep);return `<article class="card"><div class="row between"><span class="tag ${e.priority==='High'?'red':'amber'}">${E(e.type||'General development')}</span><span class="tag">${E(e.status)}</span></div><h2 style="margin-top:13px">${E(e.title)}</h2><p class="tiny muted">${E(e.source)} · ${E(e.date)} · ${e.engine==='AI'?'AI-assessed evidence':e.engine==='Case study'?'Case-study evidence':'Headline / keyword triage'} ${safeURL(e.url)?`· <a href="${E(safeURL(e.url))}" target="_blank" rel="noopener noreferrer">Open source</a>`:''}</p>${e.text?`<p class="small">${E(e.text)}</p>`:''}<div class="chip"><strong>${E(d?.name||'Relationship unavailable')}</strong><p>${E(eventTransmission(e,d))}</p></div><p class="tiny muted">${E(e.missing||'Confirm the legal entity, affected operation, timing and mitigation. Unstated financial effects remain assumptions.')}</p>${e.confirmedWeeks!==null&&e.confirmedWeeks!==undefined?`<p class="small">Evidence states a ${e.confirmedWeeks}-week interruption. Confirm applicability to the borrower.</p>`:''}<div class="row">${button('Assess impact','useEvent:'+e.id,true)}${button('Confirm relevant','eventRelevant:'+e.id)}${S.role==='Analyst'?button('Dismiss','eventDismiss:'+e.id):''}${S.connection.url?button('Analyse evidence with AI','analyseEvent:'+e.id):''}</div>${S.role==='Analyst'?`<details><summary>Analyst notes</summary><form class="eventNote" data-event="${E(e.id)}"><label class="field">Internal assessment<textarea name="note" rows="3" maxlength="2000">${E(e.note||'')}</textarea></label><button>Save internal note</button></form></details>`:''}</article>`;}
function classifyHeadline(title){const t=title.toLowerCase();if(/shutdown|shut down|closure|disrupt|strike|halt|factory fire|flood|suspend.*production|recall/.test(t))return 'Supplier disruption';if(/late payment|payment delay|insolven|bankrupt|liquidat|default/.test(t))return 'Customer payment delay';if(/tariff|cost increase|price increase|wage|levy|regulation/.test(t))return 'Cost increase';if(/acqui|merger|takeover|divest|restructur/.test(t))return 'Corporate action';return 'General development';}
function entityMatch(title,d){const text=norm(title),choices=[d.name,d.alias].filter(Boolean).map(norm);return choices.some(n=>{const stripped=n.replace(/\b(ltd|limited|pte|plc|inc|corporation|corp|company|co)\b/g,'').replace(/\s+/g,' ').trim();return stripped.length>=4&&text.includes(stripped);});}
function newsDate(v){const m=String(v||'').match(/^(\d{4})(\d{2})(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:today();}
async function requestJSON(url,options={},timeout=25000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(url,{...options,signal:controller.signal});const text=await r.text();let data;try{data=JSON.parse(text);}catch{throw Error('The service returned a non-JSON response. Try again later.');}if(!r.ok)throw Error(data.error||'Service returned HTTP '+r.status);return data;}finally{clearTimeout(timer);}}
function scenarioExisting(){const t=S.terms,s=S.scenario,m=model(),products=['Amortising term loan','Equal principal term loan','Revolving / bullet facility'];return head('','Financing and stress testing','Compare loan structures and review the cash impact of a defined business disruption.')+`<form id="scenarioForm"><fieldset><div class="grid equal"><section class="card"><h2>Indicative financing terms</h2><div class="forms">${select('Structure','product',products,t.product)}${field('Tenor · years','years',t.years,'number','required min="1" max="15" step="0.5"')}${field('Nominal annual interest %','rate',t.rate,'number','required min="0" max="30" step="0.05"')}${field('Interest-only grace · months','grace',t.grace,'number','required min="0" max="179" step="1"')}${field('Upfront fee %','fee',t.fee,'number','required min="0" max="10" step="0.1"')}${field('Proposed amount · SGD','requested',S.company.requested,'number','required min="0" max="1000000000000" step="any"')}</div><p class="tiny muted">Grace is ignored for a bullet facility. Grace must be shorter than the tenor for amortising structures. Rates are assumptions, not DBS quotations.</p></section><section class="card"><h2>Scenario assumptions</h2><div class="forms">${select('Shock to test','type',['Supplier disruption','Customer payment delay','Cost increase','No shock'],s.type)}${field('Post-project opening cash · SGD','openingCash',s.openingCash,'number','required min="0" max="1000000000000" step="any"')}${field('Disruption length · weeks','weeks',s.weeks,'number','required min="0" max="104" step="0.5"')}${field('Inventory coverage · weeks','inventory',s.inventory,'number','required min="0" max="104" step="0.5"')}${field('Replacement supply coverage %','replacement',s.replacement,'number','required min="0" max="100" step="any"')}${field('Lost sales recovered within horizon %','recovery',s.recovery,'number','required min="0" max="100" step="any"')}${field('Revenue dependent on this input %','revenueShare',s.revenueShare,'number','required min="0" max="100" step="any"')}${field('Cash contribution margin %','margin',s.margin,'number','required min="0" max="100" step="any"')}${field('Affected receivable · SGD','invoice',s.invoice,'number','required min="0" max="1000000000000" step="any"')}${field('Additional collection delay · days','days',s.days,'number','required min="0" max="730" step="1"')}${field('One-off cost increase · SGD','cost',s.cost,'number','required min="0" max="1000000000000" step="any"')}</div></section></div><div class="actionbar"><span class="tiny muted">Only inputs for the selected shock affect results. Edit, then recalculate.</span><button class="primary">Recalculate scenario</button></div></fieldset></form><div class="grid four metrics" style="margin-top:23px">${kpi('Minimum scenario cash',money(m.minCash,true),'Includes opening cash and fees')}${kpi('Baseline debt service cover',times(m.baseDSCR),'First 12 months including proposed loan')}${kpi('Scenario cash coverage',times(m.stressDSCR),'Timing-adjusted CFADS / debt service')}${kpi('12-month cash impact',money(m.cashLoss12,true),'Includes temporary receipt timing')}</div><section class="card"><h2>Closing cash forecast</h2>${chart(m)}<details open><summary>Show the calculation and assumptions</summary><p class="small">Supplier shock: max(0, min(52, disruption weeks) − inventory weeks) × (1 − replacement %) = <strong>${m.affectedWeeks.toFixed(2)} equivalent uncovered weeks</strong>. Revenue at risk is annual revenue ÷ 52 × dependent revenue share × uncovered weeks × (1 − recovered sales %). Cash impact uses the entered contribution margin.</p><p class="small">Estimated unrecovered sales: ${money(m.revenueLost)}. Lost cash contribution: ${money(m.contributionLost)}. A cost increase is a one-off payment in month 1. A delayed invoice is withheld in month 1 and recovered in month 1 + ceil(delay days ÷ 30), if within the forecast. A 0-day delay causes no withholding.</p><p class="tiny muted">Planning stress model, not a calibrated prediction. Supplier exposure is capped at 52 weeks for this 12-month horizon; the estimated loss is spread across affected months. Impacts beyond month 12 are excluded. Forecast starts AFTER project deployment: drawdowns and project spend are excluded; upfront financing fees are paid at the start. Baseline monthly CFADS is annual CFADS / 12. No seasonality, tax response, FX or default probability is modelled. Timing-adjusted coverage is not a contractual DSCR unless its definition permits this treatment.</p></details><div class="tablewrap"><table><thead><tr><th>Month</th><th class="num">Baseline closing cash</th><th class="num">Scenario closing cash</th></tr></thead><tbody>${m.base.map((v,i)=>`<tr><td>${i+1}</td><td class="num">${money(v)}</td><td class="num ${m.stress[i]<0?'negative':''}">${money(m.stress[i])}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>Compare structures on the same assumptions</h2><div class="tablewrap"><table><thead><tr><th>Structure</th><th class="num">First 12-month new debt service</th><th class="num">Full-tenor interest + fee</th><th class="num">Final principal payment</th><th class="num">Scenario coverage</th></tr></thead><tbody>${products.map(p=>{const a=loan(p),mm=model(s,p);return `<tr><td>${E(p)}${p===t.product?' <span class="tag red">Selected</span>':''}</td><td class="num">${money(mm.newService)}</td><td class="num">${money(a.reduce((x,r)=>x+r.interest,0)+S.company.requested*t.fee/100)}</td><td class="num">${money(a[a.length-1].principal)}</td><td class="num">${times(mm.stressDSCR)}</td></tr>`;}).join('')}</tbody></table></div><p class="tiny muted">A bullet structure can show stronger near-term coverage while concentrating principal at maturity. Affordability must include that balloon and refinancing risk.</p>${button('Download full repayment schedule','scheduleCSV')}</section>`;}

function csvEncode(rows){return rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function csvParse(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(q)throw Error('Unclosed CSV quote.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}

function covValues(){const f=latest(),m=readyForModel()?model():null;return[{name:'Debt service coverage',actual:ratio(f.cfads,f.debtService),forecast:m?.stressDSCR??null,limit:S.cov.dscr,min:true,note:'Scenario cash coverage; reconcile to the agreed CFADS definition.'},{name:'Current ratio',actual:ratio(f.currentAssets,f.currentLiabilities),forecast:m&&finite(f.currentAssets)?ratio(f.currentAssets-m.cashLoss12,f.currentLiabilities):null,limit:S.cov.current,min:true,note:'Cash-impact sensitivity, assuming unchanged current liabilities.'},{name:'Debt to equity',actual:ratio(f.debt,f.equity),forecast:finite(f.debt)?ratio(f.debt+S.company.requested,f.equity):null,limit:S.cov.de,min:false,note:'Pro forma at full draw; excludes subsequent amortisation or equity movements.'}];}

function financialFromForm(d){const f=blankFinancial(d.year,d.source);f.asof=d.asof;for(const k of Object.keys(FIELDS)){const raw=d[k];f[k]=raw===null||raw===undefined||String(raw).trim()===''?null:Number(raw);if(f[k]!==null&&(!finite(f[k])||Math.abs(f[k])>1e12))throw Error('Invalid amount for '+FIELDS[k]);}if(!/^\d{4}$/.test(f.year))throw Error('Use a four-digit financial year.');for(const k of ['revenue','currentAssets','currentLiabilities','inventory','debt','cash','interest','debtService','receivables'])if(f[k]!==null&&f[k]<0)throw Error(FIELDS[k]+' cannot be negative.');if(known(f.inventory,f.currentAssets)&&f.inventory>f.currentAssets)throw Error('Inventory exceeds current assets.');return f;}

async function readWorkbook(file,target){if(!file)return;if(!/\.(xlsx|csv)$/i.test(file.name))throw Error('Save legacy Excel files as .xlsx before importing.');if(file.size>15*1024*1024)throw Error('Use a workbook smaller than 15 MB.');if(typeof XLSX==='undefined')throw Error('Workbook engine unavailable. Reload the page.');const bytes=await file.arrayBuffer();const wb=XLSX.read(bytes,{type:'array',cellDates:true,dense:false});if(wb.SheetNames.length>50)throw Error('Use a workbook with at most 50 sheets.');stageImport={...extractWorkbook(wb,file.name),target,wb};page='documents';render();document.querySelector('.import-review')?.scrollIntoView({behavior:'smooth'});toast('Workbook read. Review the extracted fields before applying.');}

function validatePortfolio(x){if(!x||x.version!==3||!Array.isArray(x.companies)||!x.companies.length||x.companies.length>100||!Array.isArray(x.loans)||x.loans.length>500)throw Error('Choose a valid portfolio workspace.');const ids=new Set();for(const c of x.companies){if(!/^[A-Za-z0-9_-]{1,100}$/.test(c.id)||ids.has(c.id)||!c.profile?.name||!Array.isArray(c.financials)||!c.financials.length||!Array.isArray(c.deps)||!Array.isArray(c.events))throw Error('Invalid company profile.');ids.add(c.id);for(const f of c.financials){if(!/^\d{4}$/.test(String(f.year)))throw Error('Invalid financial year.');for(const k of Object.keys(FIELDS))if(f[k]!==null&&!finite(f[k]))throw Error('Invalid financial figure.');}c.benchmarks=c.benchmarks||[];c.monitor={enabled:false,error:'',warning:'',lastRun:'',...c.monitor};for(const d of c.deps){if(!/^[A-Za-z0-9_-]{1,100}$/.test(d.id)||!d.name||!['Supplier','Customer'].includes(d.kind)||!finite(d.share)||d.share<0||d.share>100)throw Error('Invalid relationship.');for(const [k,max]of [['lat',90],['lon',180]])if(d[k]!==null&&d[k]!==undefined&&(!finite(d[k])||Math.abs(d[k])>max))throw Error('Invalid relationship coordinates.');}}
 const lids=new Set();for(const l of x.loans){if(!/^[A-Za-z0-9_-]{1,100}$/.test(l.id)||lids.has(l.id)||!ids.has(l.companyId)||!l.application||!l.terms||!l.scenario||!l.cov||!STAGES.includes(l.status))throw Error('Invalid loan case.');lids.add(l.id);for(const k of ['project','requested','equityFunding','availableFacility','contingency','workingCapital'])if(!finite(l.application[k])||l.application[k]<0||l.application[k]>1e12)throw Error('Invalid loan amount.');if(!finite(l.terms.years)||l.terms.years<1||l.terms.years>15||!finite(l.terms.rate)||l.terms.rate<0||l.terms.rate>30||!finite(l.terms.grace)||l.terms.grace<0||l.terms.grace>=l.terms.years*12||!PRODUCTS.includes(l.terms.product))throw Error('Invalid facility terms.');l.statusHistory=Array.isArray(l.statusHistory)?l.statusHistory.slice(-100):[];l.scenarios=Array.isArray(l.scenarios)?l.scenarios.slice(0,6):[];}
 if(!ids.has(x.customerId))throw Error('Customer profile is missing.');x.role=x.role==='Analyst'?'Analyst':'Customer';x.connection={url:safeURL(x.connection?.url)||SERVICE_URL,ready:false,message:'',checkedAt:''};x.audit=Array.isArray(x.audit)?x.audit.slice(0,500):[];x.caseSequence=Number.isInteger(x.caseSequence)?x.caseSequence:100;x.monitorEnabled=!!x.monitorEnabled;return x;}

function selectLoan(id,nextTab='overview'){flush();const l=loanById(id);if(!l||isAnalyst()&&l.status==='Draft'||(!isAnalyst()&&l.companyId!==DB.customerId)){toast('This case is unavailable in this workspace.');return;}activeLoanId=l.id;DB.activeLoanId=l.id;profileId=l.companyId;caseTab=nextTab;page='case';editDep=null;stageImport=null;hydrate();persist();render();window.scrollTo({top:0,behavior:'smooth'});}
function go(p){flush();const aliases={documents:['profile','financials'],alerts:['case','review','monitoring'],exposure:['case','exposure'],scenarios:['case','planner'],covenants:['case','review','covenants'],review:['case','review','decision'],application:['application']};if(aliases[p]){const [dest,tab,sub]=aliases[p];page=dest;if(dest==='profile'){profileId=activeLoan()?.companyId||DB.customerId;profileTab=tab;}else if(tab)caseTab=tab;if(sub)reviewTab=sub;}else page=p;if(page==='profile'&&!profileId)profileId=DB.customerId;editDep=null;hydrate();render();window.scrollTo({top:0,behavior:'smooth'});}
function caseModel(l){return withLoan(l,()=>readyForModel()?model():null);}
function loanBalance(l){if(l.status!=='Disbursed')return 0;const start=new Date((l.disbursedAt||today())+'T00:00:00'),now=new Date(),months=Math.max(0,(now.getFullYear()-start.getFullYear())*12+now.getMonth()-start.getMonth());const rows=schedule(l.application.requested,l.terms.rate,l.terms.years,l.terms.product,l.terms.grace);return months?rows[Math.min(months-1,rows.length-1)]?.balance??0:l.application.requested;}
function nextPayment(l){if(l.status!=='Disbursed')return null;const start=new Date((l.disbursedAt||today())+'T00:00:00'),now=new Date(),month=Math.max(0,(now.getFullYear()-start.getFullYear())*12+now.getMonth()-start.getMonth()),rows=schedule(l.application.requested,l.terms.rate,l.terms.years,l.terms.product,l.terms.grace);const row=rows[month];if(!row)return null;const due=new Date(start.getFullYear(),start.getMonth()+month+1,start.getDate());return{amount:row.payment,date:due.toLocaleDateString('en-SG',{dateStyle:'medium'})};}
function covenantSummary(l){return withLoan(l,()=>{const values=covValues(),breaches=values.filter(v=>v.actual!==null&&(v.min?v.actual<v.limit:v.actual>v.limit));return{values,breaches,confirmed:S.cov.confirmed};});}

function submissionIssues(){const issues=[];if(!S.company.name.trim()||!S.company.industry.trim())issues.push('Complete the company profile');if(!S.company.purpose.trim()||!S.company.growth.trim())issues.push('Enter the financing purpose and growth opportunity');if(S.company.project<=0||S.company.requested<=0)issues.push('Enter a positive project cost and requested amount');if(!S.confirmed||!finite(latest().revenue))issues.push('Review and confirm the company financials');if(Math.abs(fundingDifference())>=1&&!S.company.amountReason.trim())issues.push('Explain the funding difference');if(S.company.contingency+S.company.workingCapital>0&&!S.company.bufferReason.trim())issues.push('Explain the funding allowances');if(S.deps.some(d=>!d.confirmed))issues.push('Confirm declared business relationships');return issues;}

function scenarioLibrary(l){if(l.scenarios?.length)return l.scenarios;const d=S.deps.find(x=>x.kind==='Supplier'),inventory=d?.inventory??0,margin=ratio(latest().grossProfit,latest().revenue);return [{name:'Mild disruption',severity:'Mild',weeks:Math.max(2,inventory+1),inventory,replacement:75,recovery:60,revenueShare:15,margin:margin===null?25:Math.min(100,Math.max(0,margin*100)),explanation:'Short interruption with substantial replacement supply.'},{name:'Moderate disruption',severity:'Moderate',weeks:Math.max(6,inventory+3),inventory,replacement:35,recovery:25,revenueShare:30,margin:margin===null?25:Math.min(100,Math.max(0,margin*100)),explanation:'Longer interruption with partial replacement and limited sales recovery.'},{name:'Severe disruption',severity:'Severe',weeks:Math.max(12,inventory+8),inventory,replacement:5,recovery:0,revenueShare:50,margin:margin===null?25:Math.min(100,Math.max(0,margin*100)),explanation:'Extended interruption, weak substitution and a wider revenue dependency.'}];}

ties. Revenue dependency is separate from procurement concentration.</p></section><div class="notice subtle">Changes here save a planning comparison. The facility’s application amount and terms change only when you choose Apply planning terms.</div>${form}<div class="row">${['Draft','Information requested'].includes(l.status)?button('Apply planning terms to application','applyPlan'):''}${button('View application','go:application')}</div>`;}

function settingsPage(){if(!isAnalyst())return pageIntro('Workspace settings','Company data and presentation information.')+`<section class="card"><h2>Workspace data</h2><div class="row">${button('Export company data','backup')}${button('Restore workspace','restore')}</div><p class="tiny muted">The company profile and facilities are saved in this browser.</p></section><section class="card"><details><summary>About this prototype</summary><p class="small">An academic proposal for a DBS IDEAL extension. Initial companies and facilities are demonstration records. Imports, calculations and maps work locally. Application stages are local records, not a live DBS submission. AI and public monitoring depend on the configured service.</p></details></section>`;return pageIntro('Service settings','Portfolio data, monitoring and presentation controls.')+`<section class="card"><h2>Monitoring & AI service</h2><p class="small">Service: ${tag(DB.connection.ready?'Connected':'Connection pending',DB.connection.ready?'green':'amber')}</p><p class="small muted">${E(DB.connection.message||'The service address is already configured. Customers do not enter a connection token.')}</p><form id="connectionV3"><div class="forms">${field('Service HTTPS address','url',DB.connection.url,'url','required')}</div><div class="row"><button>Save service address</button>${button('Check service','testConnection',true)}</div></form><label class="check"><input id="portfolioAuto" type="checkbox" ${DB.monitorEnabled?'checked':''}>Refresh confirmed company counterparties every 10 minutes while this workspace is open</label><p class="tiny muted">Names, declared dependency descriptions and public news extracts are used for AI analysis. Financial workbooks remain in this browser. The service requires the supplied portfolio Worker update.</p>${DB.connection.detail?`<details><summary>Connection details</summary><p class="tiny muted">${E(DB.connection.detail)}</p></details>`:''}</section><section class="card"><h2>Workspace</h2><div class="row">${button('Export portfolio','backup')}${button('Restore workspace','restore')}${button('Load presentation portfolio','walkthrough')}</div></section><section class="card"><details><summary>About this prototype</summary><p class="small">An academic proposal for a DBS IDEAL extension. Initial companies, loans and case-study notices are demonstration records. Actual workbook extraction, calculations and geographic interactions run in the page. Live AI requires the configured Worker to be deployed. Public news is evidence to assess, not proof of a borrower impact.</p><p class="small">The workspace is saved in this browser. Customer and analyst switches demonstrate two interfaces; they do not provide bank authentication, shared multi-user records or a real DBS application connection. External news and detailed map providers can be unavailable.</p><p class="small">The globe uses MapLibre GL JS with Esri satellite detail where available. Embedded Natural Earth geography supports the interactive globe if WebGL or map services are unavailable. Positions are supplied site coordinates or labelled approximations. Excel parsing uses SheetJS Community Edition.</p></details></section>`;}

let globeController=null,mapLibrePromise=null;
const RAD=Math.PI/180;
function globeProject(lon,lat,centreLon,centreLat){const p=lat*RAD,c=centreLat*RAD,d=(lon-centreLon)*RAD;return{x:Math.cos(p)*Math.sin(d),y:Math.cos(c)*Math.sin(p)-Math.sin(c)*Math.cos(p)*Math.cos(d),z:Math.sin(c)*Math.sin(p)+Math.cos(c)*Math.cos(p)*Math.cos(d)};}
function globeUnproject(x,y,centreLon,centreLat){const c=centreLat*RAD,z=Math.sqrt(Math.max(0,1-x*x-y*y));return{lat:Math.asin(Math.max(-1,Math.min(1,y*Math.cos(c)+z*Math.sin(c))))/RAD,lon:centreLon+Math.atan2(x,z*Math.cos(c)-y*Math.sin(c))/RAD};}
function geographicArc(a,b,steps=48){const vector=([lon,lat])=>{const p=lat*RAD,l=lon*RAD;return[Math.cos(p)*Math.cos(l),Math.cos(p)*Math.sin(l),Math.sin(p)];},u=vector(a),v=vector(b),angle=Math.acos(Math.max(-1,Math.min(1,u.reduce((s,n,i)=>s+n*v[i],0))));if(angle<1e-6)return[a,b];return Array.from({length:steps+1},(_,i)=>{const t=i/steps,aa=Math.sin((1-t)*angle)/Math.sin(angle),bb=Math.sin(t*angle)/Math.sin(angle),p=u.map((n,j)=>aa*n+bb*v[j]);return[Math.atan2(p[1],p[0])/RAD,Math.atan2(p[2],Math.hypot(p[0],p[1]))/RAD];});}
function companyPoint(c){return known(c.lat,c.lon)?[c.lon,c.lat]:COUNTRY_POINTS[c.country]?[COUNTRY_POINTS[c.country][1],COUNTRY_POINTS[c.country][0]]:[103.82,1.35];}
function globePerspective(){const p=companyPoint(S.company);const perspectives={'Global':{center:[95,18],zoom:0.2},'Asia Pacific':{center:[110,15],zoom:2.5},'Europe':{center:[12,50],zoom:3},'Americas':{center:[-85,25],zoom:2.3},'Middle East & Africa':{center:[30,12],zoom:2.5},'Singapore':{center:[103.82,1.35],zoom:10.5},'Borrower location':{center:p,zoom:S.company.locationPrecision==='Declared site'?11:5}};return perspectives[mapScope]||perspectives.Global;}

document.addEventListener('change',async event=>{const t=event.target;try{if(t.id==='portfolioRegion'){regionFilter=t.value;render();return;}if(t.id==='loanStatus'){listStatus=t.value;render();return;}if(t.id==='inboxPriority'){inboxFilter=t.value;render();return;}if(t.id==='globeRegion'){mapScope=t.value;setGlobePerspective();return;}if(t.id==='includedDebtService'){activeLoan().includedInExistingDebtService=t.checked;hydrate();changed('Updated debt-service inclusion for '+activeLoanId);return;}if(t.id==='finPeriod'){finIndex=Number(t.value);render();return;}if(t.name==='type'&&t.closest('#scenarioV2')){updateScenarioFields();return;}if(t.id==='portfolioAuto'){DB.monitorEnabled=t.checked;persist();startMonitoring();return;}if(t.id==='workbookFile'||t.id==='peerFile'){lastImportCompany=profileId||activeCompany().id;await readWorkbook(t.files[0],t.id==='peerFile'?'peer':'company');return;}if(t.id==='restoreFile'){const file=t.files[0];if(!file)return;if(file.size>8e6)throw Error('Use a workspace smaller than 8 MB.');let data=JSON.parse(await file.text());if(data.version===2)data=seedV3(validateV2(data));else data=validatePortfolio(data);if(!confirm('Replace this browser workspace with the selected export?'))return;DB=data;activeLoanId=DB.loans[0]?.id||'';profileId=DB.customerId;page='home';stageImport=null;hydrate();persist();render();startMonitoring();}}catch(e){toast(e.message);}finally{if(t.type==='file')t.value='';}});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='loanSearch'){listSearch=t.value;const selection=t.selectionStart;render();const input=document.getElementById('loanSearch');input.focus();input.setSelectionRange(selection,selection);}if(t.closest('#applicationV3')){const form=t.closest('form'),d=formData(form),gapValue=Math.max(0,num(d.project)+num(d.contingency)+num(d.workingCapital)-num(d.equityFunding)-(form.elements.namedItem('facilityConfirmed').checked?num(d.availableFacility):0));document.getElementById('fundingGap').textContent=money(gapValue);document.getElementById('fundingDelta').textContent=money(num(d.requested)-gapValue);}});
document.addEventListener('click',async event=>{const b=event.target.closest('[data-action]');if(!b)return;if(b.closest('form'))event.preventDefault();const [a,...parts]=b.dataset.action.split(':'),v=parts.join(':');try{switch(a){
 case'go':if(v==='profile'){profileId=isAnalyst()?activeLoan()?.companyId||DB.customerId:DB.customerId;profileTab='details';}go(v);break;
 case'role':flush();DB.role=v==='Analyst'?'Analyst':'Customer';page='home';listSearch='';listStatus='All stages';regionFilter='All regions';if(!isAnalyst()){activeLoanId=companyLoans(DB.customerId)[0]?.id||'';profileId=DB.customerId;}hydrate();persist();render();break;
 case'openCase':selectLoan(v);break;
 case'openPlanner':selectLoan(v,'planner');break;
 case'acceptOffer':if(!isAnalyst()&&S.status==='Offer issued'){S.status='Offer accepted';S.statusHistory.push({status:'Offer accepted',time:new Date().toISOString(),message:'Customer recorded offer acceptance in the workspace.'});changed('Recorded offer acceptance for '+activeLoanId);}break;
 case'openCovenants':selectLoan(v,'review');reviewTab='covenants';render();break;
 case'openSignal':{const [lid,eid]=parts;selectLoan(lid,'review');reviewTab='monitoring';render();document.querySelector(`[data-action="useEvent:${CSS.escape(eid)}"]`)?.closest('article')?.scrollIntoView({behavior:'smooth',block:'center'});break;}
 case'caseTab':flush();caseTab=v;page='case';hydrate();render();break;
 case'reviewTab':flush();caseTab='review';reviewTab=v;page='case';hydrate();render();break;
 case'profileTab':flush();profileTab=v;page='profile';profileId=profileId||activeLoan()?.companyId||DB.customerId;hydrate();render();break;
 case'newApplication':createApplication();break;
 case'stageFilter':listStatus=v;go('loans');break;
 case'customerExposure':{const l=companyLoans(DB.customerId)[0];if(l)selectLoan(l.id,'exposure');break;}
 case'newDep':editDep=null;render();document.getElementById('depEditor')?.scrollIntoView({behavior:'smooth'});break;
 case'editDep':editDep=v;render();document.getElementById('depEditor')?.scrollIntoView({behavior:'smooth'});break;
 case'deleteDep':if(confirm('Remove this relationship and its linked events?')){S.deps=S.deps.filter(d=>d.id!==v);S.events=S.events.filter(e=>e.dep!==v);editDep=null;changed('Removed declared counterparty');}break;
 case'bankConfirm':if(isAnalyst()){const d=S.deps.find(d=>d.id===v);if(d){d.bankReviewed=true;changed('Bank reviewed dependency '+d.name);}}break;
 case'filterDep':caseTab='review';reviewTab='monitoring';page='case';render();break;
 case'focusDep':selectedDep=v;focusGlobeDependency(v);break;
 case'confirmFinancials':if(!finite(latest().revenue))throw Error('Review a revenue figure first.');S.confirmed=true;changed('Company confirmed financial figures and sources');break;
 case'workbookTemplate':templateWorkbook();break;
 case'peerImport':document.getElementById('peerFile')?.click();break;
 case'cancelImport':stageImport=null;render();break;
 case'eventRelevant':{const e=S.events.find(e=>e.id===v);if(e){e.status='Relevant';changed('Confirmed event relevance '+e.title);}break;}
 case'eventDismiss':if(isAnalyst()){const e=S.events.find(e=>e.id===v);if(e){e.status='Dismissed';changed('Dismissed event '+e.title);}}break;
 case'useEvent':{const e=S.events.find(e=>e.id===v),d=S.deps.find(d=>d.id===e?.dep);if(!e||!d)break;flush();const l=activeLoan();if(!l.planning)l.planning={terms:clone(l.terms),requested:l.application.requested,scenario:clone(l.scenario)};l.planning.scenario={...l.planning.scenario,event:e.id,type:['Supplier disruption','Customer payment delay','Cost increase'].includes(e.type)?e.type:d.kind==='Supplier'?'Supplier disruption':'Customer payment delay',inventory:d.inventory,weeks:e.confirmedWeeks??l.planning.scenario.weeks};caseTab='planner';page='case';hydrate();persist();render();break;}
 case'analyseEvent':await analyseEvent(v);break;
 case'scan':await scanNews();break;
 case'scanPortfolio':await scanPortfolio();break;
 case'generateScenarios':await generateScenarios();break;
 case'applyStress':applyStress(v);break;
 case'preset':S.scenario.weeks=Number(v);S.scenario.type='Supplier disruption';changed('Applied duration sensitivity');break;
 case'applyPlan':{const l=activeLoan();if(!['Draft','Information requested'].includes(l.status)||!l.planning)break;l.application.requested=l.planning.requested;l.terms=clone(l.planning.terms);l.scenario=clone(l.planning.scenario);caseTab='overview';hydrate();changed('Applied planning terms to application');break;}
 case'testConnection':await checkService();break;
 case'geocodeBorrower':await geocode(true);break;
 case'geocodeDependency':await geocode(false);break;
 case'chooseLocation':{const [lat,lon,kind]=parts,f=document.getElementById(kind==='borrower'?'profileV3':'dependencyV2');if(f){f.elements.namedItem('lat').value=lat;f.elements.namedItem('lon').value=lon;toast('Coordinates selected. Save the profile or relationship to apply.');}break;}
 case'backup':flush();download(isAnalyst()?'IDEAL_Lens_Portfolio_v3.json':'IDEAL_Lens_Company_v3.json',JSON.stringify(isAnalyst()?DB:customerPack(),null,2));break;
 case'restore':document.getElementById('restoreFile').click();break;
 case'walkthrough':if(confirm('Load the presentation portfolio? Export your current workspace first to retain it.')){DB=seedV3();activeLoanId=DB.activeLoanId;profileId=DB.customerId;page='home';hydrate();persist();render();}break;
 case'scheduleCSV':download('Repayment_Schedule.csv',csvEncode([['month','principal_SGD','interest_SGD','payment_SGD','balance_SGD'],...loan().map(r=>[r.month,r.principal.toFixed(2),r.interest.toFixed(2),r.payment.toFixed(2),r.balance.toFixed(2)])]),'text/csv');break;
 case'packJSON':download(activeLoanId+'_Review.json',JSON.stringify(workspacePack(),null,2));break;
 case'print':preparePrint();window.print();break;
 }}catch(e){toast(e.message);}});
DB=loadPortfolio();activeLoanId=DB.activeLoanId&&loanById(DB.activeLoanId)?DB.activeLoanId:DB.loans[0]?.id||'';profileId=DB.customerId;page='home';hydrate();render();startMonitoring();
