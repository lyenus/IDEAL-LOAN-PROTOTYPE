<script>
'use strict';
const KEY='ideal-lens-v1';
const NAV=[['overview','01','Workspace overview'],['application','02','Application'],['documents','03','Documents & data'],['financials','04','Financial health'],['dependencies','05','Business dependencies'],['intelligence','06','Risk intelligence'],['scenarios','07','Financing & scenarios'],['covenants','08','Covenant monitor'],['review','09','Review & share'],['about','10','Controls & methodology']];
const today=()=>new Date().toISOString().slice(0,10);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=x=>JSON.parse(JSON.stringify(x));
const FIELDS={revenue:'Revenue',grossProfit:'Gross profit',netIncome:'Net profit after tax',ebitda:'EBITDA',interest:'Interest expense',currentAssets:'Current assets',inventory:'Inventory',currentLiabilities:'Current liabilities',debt:'Interest-bearing debt',equity:'Total equity',cash:'Reported cash',cfo:'Operating cash flow',cfads:'Cash available for debt service',debtService:'Existing annual principal and interest',receivables:'Trade receivables'};
const seed=()=>({version:1,mode:'Illustrative dataset',role:'Finance manager',company:{name:'Meridian Mobility Pte Ltd',country:'Singapore',industry:'Transport services',purpose:'Deploy an owned electric fleet for a new service contract',growth:'Expand contracted transport capacity',currency:'SGD',project:6000000,equityFunding:1000000,availableFacility:800000,facilityConfirmed:true,requested:4200000,collateral:'Proposed security over borrower-owned financed vehicles; ownership and existing charges require legal review.'},financials:[
{year:'2023',revenue:24000000,grossProfit:8400000,netIncome:1800000,ebitda:4600000,interest:300000,currentAssets:9000000,inventory:1100000,currentLiabilities:5500000,debt:4500000,equity:8000000,cash:1800000,cfo:3600000,cfads:3300000,debtService:950000,receivables:2700000,source:'Illustrative management accounts',page:'1',asof:today()},
{year:'2024',revenue:27500000,grossProfit:9350000,netIncome:2100000,ebitda:5200000,interest:320000,currentAssets:10200000,inventory:1200000,currentLiabilities:6100000,debt:4800000,equity:9100000,cash:2200000,cfo:4100000,cfads:3700000,debtService:1000000,receivables:3100000,source:'Illustrative management accounts',page:'1',asof:today()},
{year:'2025',revenue:31000000,grossProfit:10540000,netIncome:2450000,ebitda:5900000,interest:350000,currentAssets:11600000,inventory:1300000,currentLiabilities:6700000,debt:5200000,equity:10500000,cash:2800000,cfo:4600000,cfads:4200000,debtService:1100000,receivables:3500000,source:'Illustrative management accounts',page:'1',asof:today()}],confirmed:false,docs:[],checks:{},deps:[{id:'supplier-a',name:'Aster Fleet Components Ltd',kind:'Supplier',country:'Malaysia',site:'Johor assembly facility',item:'Critical fleet maintenance components',share:42,critical:'High',inventory:3,alternatives:8,terms:30,confirmed:true},{id:'customer-a',name:'Northstar Corporate Travel Ltd',kind:'Customer',country:'Singapore',site:'Corporate shuttle contract',item:'Receipts from a contracted shuttle service',share:28,critical:'High',inventory:0,alternatives:6,terms:45,confirmed:true}],events:[{id:'event-a',dep:'supplier-a',type:'Supplier disruption',title:'Illustrative plant interruption',text:'Example announcement: the declared assembly facility may pause deliveries. Confirm the affected product and expected recovery date.',date:today(),source:'Fictional demonstration announcement',url:'',weeks:6,days:30,cost:120000,status:'Unreviewed',illustrative:true},{id:'event-b',dep:'customer-a',type:'Customer payment delay',title:'Illustrative collection delay',text:'Example notice: a major customer requests a temporary extension to invoice payment dates.',date:today(),source:'Fictional demonstration notice',url:'',weeks:2,days:45,cost:0,status:'Unreviewed',illustrative:true}],terms:{product:'Amortising term loan',years:5,rate:4.8,grace:0,fee:0.5},scenario:{event:'event-a',type:'Supplier disruption',weeks:6,inventory:3,replacement:20,recovery:25,revenueShare:35,margin:34,invoice:450000,days:45,cost:120000,openingCash:2800000},cov:{dscr:1.2,current:1.2,de:1.5,testDate:'2027-03-31',confirmed:false,definition:'Illustrative consolidated borrower definitions: annual CFADS / annual principal and interest; current assets / current liabilities; interest-bearing debt / equity.'},benchmark:{gross:30,current:1.5,de:0.8,source:'Illustrative peer assumptions'},status:'Draft',audit:[]});
let storageOK=true,loadMessage='';let S;
try{const raw=localStorage.getItem(KEY);S=raw?validateWorkspace(JSON.parse(raw)):seed();}catch(e){S=seed();loadMessage='Saved data could not be read. Starter data loaded; you can restore an exported workspace.';}
let page='overview',editDep=null,finIndex=2,toastTimer;
function E(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=(n,compact=false)=>new Intl.NumberFormat('en-SG',{style:'currency',currency:'SGD',maximumFractionDigits:compact?2:0,notation:compact?'compact':'standard'}).format(n);
const ratio=(a,b)=>b>0?a/b:null;
const times=n=>n===null||!Number.isFinite(n)?'N/A':n.toFixed(2)+'×';
const percent=n=>n===null||!Number.isFinite(n)?'N/A':(n*100).toFixed(1)+'%';
const safeURL=u=>{try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:'';}catch{return '';}};
const latest=()=>S.financials[S.financials.length-1];
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4500);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch{storageOK=false;toast('Browser saving unavailable. Use Export workspace before leaving.');}}
function audit(action){S.audit.unshift({time:new Date().toISOString(),actor:S.role,action});S.audit=S.audit.slice(0,200);}
function changed(action){if(['Pending company review','Company reviewed','RM review requested (demo)'].includes(S.status))S.status='Draft';audit(action);persist();render();toast('Saved. Any previous review has been reset because inputs changed.');}
function canEdit(){if(S.role==='Viewer'){toast('Viewer mode is read only. Switch to Finance manager to edit.');return false;}return true;}
function gap(){return Math.max(0,S.company.project-S.company.equityFunding-(S.company.facilityConfirmed?S.company.availableFacility:0));}
function schedule(principal,rate,years,product,grace=0){const n=Math.max(1,Math.round(years*12)),r=rate/1200,g=Math.min(Math.max(0,Math.round(grace)),n-1);let bal=Math.max(0,principal);const p=bal,months=n-g,emi=r===0?p/months:p*r/(1-Math.pow(1+r,-months));const rows=[];for(let i=1;i<=n;i++){let interest=bal*r,capital=0;if(product==='Revolving / bullet facility')capital=i===n?bal:0;else if(i>g)capital=product==='Equal principal term loan'?Math.min(bal,p/months):Math.min(bal,Math.max(0,emi-interest));if(i===n)capital=bal;rows.push({month:i,interest,principal:capital,payment:capital+interest,balance:Math.max(0,bal-capital)});bal=Math.max(0,bal-capital);}return rows;}
function loan(product=S.terms.product){return schedule(S.company.requested,S.terms.rate,S.terms.years,product,S.terms.grace);}
function model(s=S.scenario,product=S.terms.product){const f=latest(),sched=loan(product),base=[],stress=[];const fee=S.company.requested*S.terms.fee/100;let bc=s.openingCash-fee,sc=s.openingCash-fee;const affectedWeeks=Math.max(0,Math.min(52,s.weeks)-s.inventory)*(1-s.replacement/100);const revenueLost=s.type==='Supplier disruption'?f.revenue/52*(s.revenueShare/100)*affectedWeeks*(1-s.recovery/100):0;const contributionLost=revenueLost*(s.margin/100);const oneOff=s.type==='Cost increase'?s.cost:0;const delay=s.type==='Customer payment delay'?Math.max(0,s.days):0;const withheld=delay>0?s.invoice:0;const recoveryMonth=delay>0?Math.ceil(delay/30):0;let cashLoss12=0,totalService=0;for(let i=0;i<12;i++){const debt=sched[i]?.payment??0;totalService+=debt;const baseline=f.cfads/12-f.debtService/12-debt;let shock=0;if(s.type==='Supplier disruption'&&i<Math.min(12,Math.max(1,Math.ceil(s.weeks/4.345))))shock=contributionLost/Math.min(12,Math.max(1,Math.ceil(s.weeks/4.345)));if(i===0)shock+=oneOff+withheld;if(withheld&&i===recoveryMonth)shock-=withheld;cashLoss12+=shock;bc+=baseline;sc+=baseline-shock;base.push(bc);stress.push(sc);}const denom=f.debtService+totalService;return{base,stress,revenueLost,contributionLost,oneOff,withheld,affectedWeeks,service:denom,newService:totalService,baseDSCR:ratio(f.cfads,denom),stressDSCR:ratio(f.cfads-cashLoss12,denom),cashLoss12,minCash:Math.min(s.openingCash-fee,...stress),ending:stress[11],schedule:sched};}
function checklist(){return [{key:'financials',label:'Three periods of financial statements and source references',done:S.confirmed},{key:'debt',label:'Existing debt schedule and usable facilities checked',done:!!S.checks.debt},{key:'project',label:'Project budget and growth evidence reviewed',done:!!S.checks.project},{key:'ownership',label:'Asset ownership and proposed security checked',done:!!S.checks.ownership},{key:'deps',label:'Critical suppliers and customers declared and confirmed',done:S.deps.length>0&&S.deps.every(d=>d.confirmed)}];}
function kpi(label,value,sub){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><small>${sub}</small></div>`;}
function button(text,action,primary=false,extra=''){return `<button ${extra} data-action="${action}" class="${primary?'primary':''}">${text}</button>`;}
function field(label,key,value,type='text',extra='',hint=''){return `<label class="field">${label}<input name="${key}" type="${type}" value="${E(value)}" ${extra}>${hint?`<span class="hint">${hint}</span>`:''}</label>`;}
function select(label,key,values,current){return `<label class="field">${label}<select name="${key}">${values.map(v=>`<option ${v===current?'selected':''}>${E(v)}</option>`).join('')}</select></label>`;}
function textarea(label,key,value,extra=''){return `<label class="field full">${label}<textarea name="${key}" rows="3" ${extra}>${E(value)}</textarea></label>`;}
function head(kicker,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`;}
function chart(m){const vals=[S.scenario.openingCash,...m.base,...m.stress],lo=Math.min(0,...vals),hi=Math.max(...vals,1),span=Math.max(hi-lo,1),x=i=>55+i*51,y=v=>180-(v-lo)/span*150;const path=a=>[S.scenario.openingCash,...a].map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');return `<svg class="chart" viewBox="0 0 730 225" role="img" aria-label="Twelve month closing cash forecast comparing baseline and selected scenario">${[lo,(lo+hi)/2,hi].map(v=>`<line x1="55" y1="${y(v)}" x2="670" y2="${y(v)}" stroke="#e7eaee"/><text x="4" y="${y(v)+4}" font-size="10" fill="#7b8490">${E(money(v,true))}</text>`).join('')}<path d="${path(m.base)}" fill="none" stroke="#8994a3" stroke-width="2.5"/><path d="${path(m.stress)}" fill="none" stroke="#d71920" stroke-width="3"/>${[0,3,6,9,12].map(i=>`<text x="${x(i)}" y="210" text-anchor="middle" font-size="10" fill="#7b8490">${i?'M'+i:'Now'}</text>`).join('')}</svg><div class="legend"><span>Baseline</span><span>Selected scenario</span></div>`;}
function overview(){const f=latest(),m=model(),checks=checklist(),done=checks.filter(c=>c.done).length;return head('Financing workspace','A clearer view of your next move.','Bring your funding plan, business dependencies and repayment resilience into one evidence-led review.',button('Continue application','go:application',true))+`<div class="grid four metrics">${kpi('Proposed new borrowing',money(S.company.requested,true),E(S.company.purpose.slice(0,48)))}${kpi('Funding gap',money(gap(),true),'After confirmed project funding')}${kpi('Business dependencies',S.deps.length,'Declared suppliers and customers')}${kpi('Items awaiting review',S.events.filter(e=>e.status==='Unreviewed').length,'Events require human confirmation')}</div><div class="grid two"><section class="card"><div class="row between"><h2>Liquidity under pressure</h2><span class="tag">12 MONTH SCENARIO</span></div><p class="small muted">${E(S.scenario.type)} · opening cash ${money(S.scenario.openingCash,true)}</p>${chart(m)}<div class="divider"></div><div class="row between"><span class="small">Minimum scenario cash <strong class="${m.minCash<0?'negative':''}">${money(m.minCash,true)}</strong></span>${button('Explore assumptions','go:scenarios')}</div></section><section class="card"><div class="row between"><h2>Application readiness</h2><span class="tag red">${done} / ${checks.length}</span></div><div class="progress"><div style="width:${done/checks.length*100}%"></div></div>${checks.map(c=>`<p class="small">${c.done?'✓':'○'} ${c.label}</p>`).join('')}<div class="divider"></div><p class="app-status">${E(S.status)}</p><p class="tiny muted">Readiness is a checklist, not a credit score or approval.</p></section></div><section class="card" style="margin-top:20px"><div class="row between"><div><div class="eyebrow">Your main innovation</div><h2>See the risk beyond the borrower.</h2></div>${button('Open risk intelligence','go:intelligence')}</div><div class="network"><div class="node">${E(S.deps.find(d=>d.kind==='Supplier')?.name||'Declare a supplier')}<br><span class="muted tiny">Supply dependency</span></div><span class="edge">→</span><div class="node center">${E(S.company.name)}<br><span class="tiny">Operations & cash flow</span></div><span class="edge">→</span><div class="node">Repayment resilience<br><span class="muted tiny">Human credit review</span></div></div><p class="small muted">External event → confirmed dependency → operational consequence → transparent financial scenario → action.</p></section>`;}
function application(){const c=S.company;return head('Prepare','Make the financing need explicit.','Capture the growth opportunity, check existing funding and prepare an indicative request.')+`<div class="steps"><div class="done">01 Purpose & funding</div><div class="${S.confirmed?'done':''}">02 Verify data</div><div class="${S.deps.length?'done':''}">03 Assess dependencies</div><div class="${S.status!=='Draft'?'done':''}">04 Company review</div></div><form id="applicationForm"><fieldset><section class="card"><h2>Company and growth plan</h2><div class="forms">${field('Company legal name','name',c.name,'text','required maxlength="150"')}${field('Country','country',c.country,'text','required maxlength="80"')}${field('Industry','industry',c.industry,'text','required maxlength="120"')}${select('Dataset label','mode',['Illustrative dataset','User-provided company data'],S.mode)}${textarea('Growth opportunity','growth',c.growth,'required maxlength="1500"')}${textarea('Purpose of financing','purpose',c.purpose,'required maxlength="1500"')}</div></section><div class="grid equal"><section class="card"><h2>Funding sources · SGD</h2><div class="forms">${field('Total project cost','project',c.project,'number','min="0" max="1000000000000" required step="any"')}${field('Internal funding contribution','equityFunding',c.equityFunding,'number','min="0" max="1000000000000" required step="any"')}${field('Potential existing facility available','availableFacility',c.availableFacility,'number','min="0" max="1000000000000" required step="any"')}${field('Proposed NEW loan amount','requested',c.requested,'number','min="0" max="1000000000000" required step="any"')}</div><label class="check"><input type="checkbox" name="facilityConfirmed" ${c.facilityConfirmed?'checked':''}>Existing facility availability and permitted use confirmed</label><p class="small muted">Only confirmed usable facilities reduce the funding gap. Borrowing can be zero.</p></section><section class="card"><h2>Conditions and security</h2>${textarea('Proposed collateral and ownership checks','collateral',c.collateral,'maxlength="2000"')}<div class="notice blue">Operating risk mitigation: confirm replacement supply or buffers. Documentation mitigation: validate ownership, permitted use, security and agreement definitions before approval.</div></section></div><div class="actionbar"><span class="small muted">All amounts use SGD. No pricing or availability is a bank offer.</span><button class="primary">Save application</button></div></fieldset></form><section class="card" style="margin-top:20px"><h2>Funding cross-check</h2><div class="grid three">${kpi('Calculated funding gap',money(gap(),true),'Saved project inputs')}${kpi('Proposed amount less gap',money(c.requested-gap(),true),'A difference needs an explanation')}${kpi('Company review status',E(S.status),'Changes reset prior review')}</div></section>`;}
function documents(){return head('Verify','Good decisions start with traceable data.','Import your own structured financials, review source references and confirm the figures before use.')+`<div class="grid equal"><section class="card"><h2>Import three financial periods</h2><p class="small">Use the CSV template to enter real company data. Amounts must be plain numbers in SGD, not thousands or millions.</p><div class="row">${button('Download CSV template','template')}${button('Import financial CSV','importCSV',true)}</div><input type="file" id="csvFile" accept=".csv,text/csv" hidden><p class="tiny muted">Import requires exactly three rows, unique periods, all template columns, a source and an as-of date. It replaces financial inputs and resets confirmation.</p></section><section class="card"><h2>Supporting files</h2><p class="small">Record reference files for your checklist. File names are saved; file contents are not retained or uploaded.</p><label class="field">Add PDF, CSV or text references<input id="docFiles" type="file" accept=".pdf,.csv,.txt" multiple></label>${S.docs.map(d=>`<p class="small">${E(d.name)} <span class="muted">${Math.round(d.size/1024)} KB</span> <button class="linkbtn" data-action="removeDoc:${E(d.id)}">Remove</button></p>`).join('')}<p class="tiny muted">PDFs are references only. This base does not extract PDF tables or run an AI document model.</p></section></div><section class="card" style="margin-top:20px"><h2>Assist with structured text extraction</h2><p class="small muted">Paste one <strong>template key: number</strong> per line, such as revenue: 31000000. This is a working rule-based text parser, not AI. It updates the latest period only; confirm the result in Financial health.</p><form id="textForm"><fieldset><label class="field">Financial text<textarea name="text" rows="4" placeholder="revenue: 31000000&#10;grossProfit: 10540000&#10;netIncome: 2450000" required></textarea></label><div class="forms" style="margin-top:15px">${field('Source document','source','','text','required maxlength="300"')}${field('Source page / section','sourcePage','','text','required maxlength="80"')}</div><button type="submit">Extract recognised fields</button></fieldset></form><details><summary>Accepted keys</summary><p class="tiny">${Object.keys(FIELDS).join(', ')}</p><p class="tiny">Plain numbers or comma-separated amounts. Currency symbols, units and duplicate keys require correction.</p></details></section><section class="card"><h2>Readiness checklist</h2><form id="checksForm"><fieldset>${checklist().map(c=>c.key==='financials'||c.key==='deps'?`<p class="small">${c.done?'✓':'○'} ${c.label} <span class="muted">— set in the relevant workspace</span></p>`:`<label class="check"><input type="checkbox" name="${c.key}" ${c.done?'checked':''}>${c.label}</label>`).join('')}<button>Save checklist</button></fieldset></form></section>`;}
const RATIOS=[['Gross profit margin',f=>ratio(f.grossProfit,f.revenue),'pct'],['Net profit margin',f=>ratio(f.netIncome,f.revenue),'pct'],['Current ratio',f=>ratio(f.currentAssets,f.currentLiabilities),'x'],['Quick ratio',f=>ratio(f.currentAssets-f.inventory,f.currentLiabilities),'x'],['Debt to equity',f=>ratio(f.debt,f.equity),'x'],['EBITDA interest cover',f=>ratio(f.ebitda,f.interest),'x'],['Existing debt service cover',f=>ratio(f.cfads,f.debtService),'x'],['Operating cash flow to debt',f=>ratio(f.cfo,f.debt),'x'],['Receivables turnover proxy',f=>ratio(f.revenue,f.receivables),'x'],['Receivable days proxy',f=>f.revenue>0?f.receivables/f.revenue*365:null,'days']];
function financials(){const f=S.financials[finIndex]||latest();return head('Understand','Financial health, with the evidence attached.','Three periods, transparent formulas and editable sources. Ratios support assessment; they do not determine approval.')+`<section class="card"><div class="row between"><h2>Three-period trend</h2><span class="tag ${S.confirmed?'green':'amber'}">${S.confirmed?'USER CONFIRMED':'CONFIRMATION NEEDED'}</span></div><div class="tablewrap"><table><thead><tr><th>Measure</th>${S.financials.map(y=>`<th class="num">${E(y.year)}</th>`).join('')}</tr></thead><tbody>${['revenue','grossProfit','netIncome','cfo'].map(k=>`<tr><td>${FIELDS[k]}</td>${S.financials.map(y=>`<td class="num">${money(y[k],true)}</td>`).join('')}</tr>`).join('')}${RATIOS.map(([l,fn,fmt])=>`<tr><td>${l}</td>${S.financials.map(y=>{const v=fn(y);return `<td class="num">${fmt==='pct'?percent(v):fmt==='days'?(v===null?'N/A':v.toFixed(1)+' days'):times(v)}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div><p class="tiny muted">Receivables ratios use closing balances as a proxy, not average balances. EBITDA interest cover is not EBIT interest cover. CFADS requires a separate reconciliation. N/A means the denominator is non-positive.</p><p class="small">Latest revenue change: <strong>${percent(ratio(latest().revenue-S.financials[1].revenue,S.financials[1].revenue))}</strong>. Review drivers, sustainability and cash conversion alongside these results.</p></section><section class="card"><div class="row between"><h2>Review or enter company financials</h2><label class="small">Period <select id="finPeriod">${S.financials.map((y,i)=>`<option value="${i}" ${i===finIndex?'selected':''}>${E(y.year)}</option>`).join('')}</select></label></div><form id="financialForm"><fieldset><div class="forms">${field('Reporting year · YYYY','year',f.year,'text','required pattern="[0-9]{4}" maxlength="4"')}${field('As-of date','asof',f.asof,'date','required')}${Object.entries(FIELDS).map(([k,l])=>field(l+' · SGD',k,f[k],'number',`${['netIncome','cfo','cfads','equity','ebitda','grossProfit'].includes(k)?'':'min="0"'} max="1000000000000" step="any" required`)).join('')}${field('Source document or URL','source',f.source,'text','required maxlength="500"')}${field('Page / section','sourcePage',f.page,'text','required maxlength="100"')}</div><div class="notice blue">CFADS is cash available BEFORE debt service, reconciled for tax, working capital and maintenance capex. Do not automatically equate it with operating cash flow. Existing debt service includes principal and interest.</div><button class="primary">Save this period</button></fieldset></form><div class="divider"></div>${button(S.confirmed?'Reconfirm financial inputs':'Confirm financial inputs reviewed','confirmFinancials')}<p class="tiny muted">User confirmation records a review; it is not an audit opinion.</p></section><section class="card"><h2>Peer reference assumptions</h2><form id="benchmarkForm"><fieldset><div class="forms">${field('Peer gross margin %','gross',S.benchmark.gross,'number','step="any" min="-100" max="100" required')}${field('Peer current ratio','current',S.benchmark.current,'number','step="any" min="0" max="1000" required')}${field('Peer debt to equity','de',S.benchmark.de,'number','step="any" min="0" max="1000" required')}${field('Peer source and period','source',S.benchmark.source,'text','required maxlength="500"')}</div><p class="small">Latest company: gross margin ${percent(ratio(latest().grossProfit,latest().revenue))}; current ratio ${times(ratio(latest().currentAssets,latest().currentLiabilities))}; debt to equity ${times(ratio(latest().debt,latest().equity))}.</p><button>Save peer reference</button></fieldset></form></section>`;}
function dependencies(){const d=S.deps.find(x=>x.id===editDep)||{name:'',kind:'Supplier',country:'',site:'',item:'',share:0,critical:'High',inventory:0,alternatives:0,terms:30,confirmed:false};return head('Map exposure','Who does the business depend on?','Declare both the relationship and its importance. Procurement or sales concentration is not the same as revenue at risk.')+`<section class="card"><h2>Declared relationships</h2>${S.deps.length?`<div class="tablewrap"><table><thead><tr><th>Counterparty</th><th>Dependency</th><th>Concentration</th><th>Verification</th><th>Actions</th></tr></thead><tbody>${S.deps.map(x=>`<tr><td><strong>${E(x.name)}</strong><br><span class="tiny muted">${E(x.kind)} · ${E(x.country)}</span></td><td>${E(x.item)}<br><span class="tiny muted">${E(x.site)}</span></td><td>${x.share}% of ${x.kind==='Supplier'?'procurement':'sales'}<br><span class="tiny">${E(x.critical)} criticality</span></td><td><span class="tag ${x.confirmed?'green':'amber'}">${x.confirmed?'Confirmed':'Unconfirmed'}</span></td><td><button class="linkbtn" data-action="editDep:${E(x.id)}">Edit</button><br><button class="linkbtn" data-action="deleteDep:${E(x.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Add a critical supplier or customer to begin.</div>'}</section><section class="card"><h2>${editDep?'Edit relationship':'Add a business dependency'}</h2><form id="depForm"><fieldset><div class="forms">${field('Legal company name','name',d.name,'text','required maxlength="150"')}${select('Relationship','kind',['Supplier','Customer'],d.kind)}${field('Country','country',d.country,'text','required maxlength="80"')}${field('Relevant site / subsidiary / contract','site',d.site,'text','required maxlength="200"')}${field('Product or service dependency','item',d.item,'text','required maxlength="300"')}${field('Share of procurement / sales %','share',d.share,'number','required min="0" max="100" step="any"')}${select('Operational criticality','critical',['High','Medium','Low'],d.critical)}${field('Inventory coverage · weeks (supplier)','inventory',d.inventory,'number','required min="0" max="104" step="0.5"')}${field('Replacement lead time · weeks','alternatives',d.alternatives,'number','required min="0" max="104" step="0.5"')}${field('Contractual payment terms · days','terms',d.terms,'number','required min="0" max="730" step="1"')}</div><label class="check"><input type="checkbox" name="confirmed" ${d.confirmed?'checked':''}>I have reviewed this relationship and its exposure details.</label><div class="row"><button class="primary">${editDep?'Save changes':'Add dependency'}</button>${editDep?button('Cancel edit','cancelDep'):''}</div></fieldset></form></section>`;}
function intelligence(){return head('Main USP','Turn an external event into a relevant question.','Review the evidence, confirm the business connection and test a scenario. This base uses manual evidence and labelled sample events.',button('Add varied demo events','addDemoEvents'))+`<div class="grid four metrics">${kpi('Declared counterparties',S.deps.length,'Borrower-provided relationships')}${kpi('Events to review',S.events.filter(e=>e.status==='Unreviewed').length,'No automated credit decision')}${kpi('Confirmed relevant',S.events.filter(e=>e.status==='Relevant').length,'Confirmed by the user')}${kpi('Evidence coverage',S.events.filter(e=>e.url).length+' linked','Source URLs supplied by users')}</div><section class="card"><h2>Event review queue</h2><p class="tiny muted">No events found is not evidence of low risk. Live news monitoring, entity resolution and AI relevance assessment need connected services.</p>${S.events.length?S.events.map(e=>{const d=S.deps.find(d=>d.id===e.dep);return `<article class="event"><div class="row between"><span class="tag ${e.illustrative?'amber':''}">${e.illustrative?'ILLUSTRATIVE EVENT':'USER-SUPPLIED EVIDENCE'}</span><span class="tag ${e.status==='Relevant'?'red':''}">${E(e.status)}</span></div><h3>${E(e.title)}</h3><p class="small">${E(e.text)}</p><p class="small"><strong>Declared link:</strong> ${E(d?.name||'Removed counterparty')} → ${E(d?.item||'Reconfirm relationship')}.</p><p class="tiny muted">${E(e.type)} · ${E(e.date)} · ${E(e.source)} ${safeURL(e.url)?`· <a href="${E(safeURL(e.url))}" target="_blank" rel="noopener noreferrer">Open source</a>`:''}</p><p class="small">${e.type==='Corporate action'?'Corporate actions can be positive, neutral or negative. Check whether ownership, continuity or contract terms actually change.':'Confirm the correct entity, site, product and timing before treating this event as relevant to repayment.'}</p><div class="row"><button data-action="relevant:${E(e.id)}">Confirm relevant</button><button data-action="dismiss:${E(e.id)}">Dismiss</button><button class="primary" data-action="useEvent:${E(e.id)}">Test impact</button><button class="linkbtn" data-action="deleteEvent:${E(e.id)}">Remove</button></div></article>`;}).join(''):'<div class="empty">No events recorded. Add evidence below.</div>'}</section><section class="card"><h2>Add evidence from a real announcement or report</h2><form id="eventForm"><fieldset><div class="forms"><label class="field">Declared counterparty<select name="dep" required><option value="">Select relationship</option>${S.deps.map(d=>`<option value="${E(d.id)}">${E(d.name)}</option>`).join('')}</select></label>${select('Event type','type',['Supplier disruption','Customer payment delay','Cost increase','Corporate action'],'Supplier disruption')}${field('Event title','title','','text','required maxlength="200"')}${field('Publication date','date',today(),'date','required')}${field('Source publisher or document','source','','text','required maxlength="300"')}${field('Source URL (optional)','url','','url','maxlength="1000"')}${textarea('Relevant extract or your summary','text','','required maxlength="3000"')}${field('Disruption length · weeks','weeks',6,'number','required min="0" max="104" step="0.5"')}${field('Additional payment delay · days','days',30,'number','required min="0" max="730"')}${field('One-off additional cost · SGD','cost',0,'number','required min="0" max="1000000000000" step="any"')}</div><p class="tiny muted">The link is made to the counterparty you select. This version does not independently verify or classify the article. Review original evidence before confirming relevance.</p><button class="primary">Add event for review</button></fieldset></form></section>`;}
function scenarios(){const t=S.terms,s=S.scenario,m=model(),products=['Amortising term loan','Equal principal term loan','Revolving / bullet facility'];return head('Compare & stress test','Different assumptions. Different outcomes.','Explore a financing structure and a defined shock. Every number follows the inputs you can inspect.')+`<form id="scenarioForm"><fieldset><div class="grid equal"><section class="card"><h2>Indicative financing terms</h2><div class="forms">${select('Structure','product',products,t.product)}${field('Tenor · years','years',t.years,'number','required min="1" max="15" step="0.5"')}${field('Nominal annual interest %','rate',t.rate,'number','required min="0" max="30" step="0.05"')}${field('Interest-only grace · months','grace',t.grace,'number','required min="0" max="179" step="1"')}${field('Upfront fee %','fee',t.fee,'number','required min="0" max="10" step="0.1"')}${field('Proposed amount · SGD','requested',S.company.requested,'number','required min="0" max="1000000000000" step="any"')}</div><p class="tiny muted">Grace is ignored for a bullet facility. Grace must be shorter than the tenor for amortising structures. Rates are assumptions, not DBS quotations.</p></section><section class="card"><h2>Scenario assumptions</h2><div class="forms">${select('Shock to test','type',['Supplier disruption','Customer payment delay','Cost increase','No shock'],s.type)}${field('Post-project opening cash · SGD','openingCash',s.openingCash,'number','required min="0" max="1000000000000" step="any"')}${field('Disruption length · weeks','weeks',s.weeks,'number','required min="0" max="104" step="0.5"')}${field('Inventory coverage · weeks','inventory',s.inventory,'number','required min="0" max="104" step="0.5"')}${field('Replacement supply coverage %','replacement',s.replacement,'number','required min="0" max="100" step="any"')}${field('Lost sales recovered within horizon %','recovery',s.recovery,'number','required min="0" max="100" step="any"')}${field('Revenue dependent on this input %','revenueShare',s.revenueShare,'number','required min="0" max="100" step="any"')}${field('Cash contribution margin %','margin',s.margin,'number','required min="0" max="100" step="any"')}${field('Affected receivable · SGD','invoice',s.invoice,'number','required min="0" max="1000000000000" step="any"')}${field('Additional collection delay · days','days',s.days,'number','required min="0" max="730" step="1"')}${field('One-off cost increase · SGD','cost',s.cost,'number','required min="0" max="1000000000000" step="any"')}</div></section></div><div class="actionbar"><span class="tiny muted">Only inputs for the selected shock affect results. Edit, then recalculate.</span><button class="primary">Recalculate scenario</button></div></fieldset></form><div class="grid four metrics" style="margin-top:23px">${kpi('Minimum scenario cash',money(m.minCash,true),'Includes opening cash and fees')}${kpi('Baseline debt service cover',times(m.baseDSCR),'First 12 months including proposed loan')}${kpi('Scenario cash coverage',times(m.stressDSCR),'Timing-adjusted CFADS / debt service')}${kpi('12-month cash impact',money(m.cashLoss12,true),'Includes temporary receipt timing')}</div><section class="card"><h2>Closing cash forecast</h2>${chart(m)}<details open><summary>Show the calculation and assumptions</summary><p class="small">Supplier shock: max(0, min(52, disruption weeks) − inventory weeks) × (1 − replacement %) = <strong>${m.affectedWeeks.toFixed(2)} equivalent uncovered weeks</strong>. Revenue at risk is annual revenue ÷ 52 × dependent revenue share × uncovered weeks × (1 − recovered sales %). Cash impact uses the entered contribution margin.</p><p class="small">Estimated unrecovered sales: ${money(m.revenueLost)}. Lost cash contribution: ${money(m.contributionLost)}. A cost increase is a one-off payment in month 1. A delayed invoice is withheld in month 1 and recovered in month 1 + ceil(delay days ÷ 30), if within the forecast. A 0-day delay causes no withholding.</p><p class="tiny muted">Planning stress model, not a calibrated prediction. Supplier exposure is capped at 52 weeks for this 12-month horizon; the estimated loss is spread across affected months. Impacts beyond month 12 are excluded. Forecast starts AFTER project deployment: drawdowns and project spend are excluded; upfront financing fees are paid at the start. Baseline monthly CFADS is annual CFADS / 12. No seasonality, tax response, FX or default probability is modelled. Timing-adjusted coverage is not a contractual DSCR unless its definition permits this treatment.</p></details><div class="tablewrap"><table><thead><tr><th>Month</th><th class="num">Baseline closing cash</th><th class="num">Scenario closing cash</th></tr></thead><tbody>${m.base.map((v,i)=>`<tr><td>${i+1}</td><td class="num">${money(v)}</td><td class="num ${m.stress[i]<0?'negative':''}">${money(m.stress[i])}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>Compare structures on the same assumptions</h2><div class="tablewrap"><table><thead><tr><th>Structure</th><th class="num">First 12-month new debt service</th><th class="num">Full-tenor interest + fee</th><th class="num">Final principal payment</th><th class="num">Scenario coverage</th></tr></thead><tbody>${products.map(p=>{const a=loan(p),mm=model(s,p);return `<tr><td>${E(p)}${p===t.product?' <span class="tag red">Selected</span>':''}</td><td class="num">${money(mm.newService)}</td><td class="num">${money(a.reduce((x,r)=>x+r.interest,0)+S.company.requested*t.fee/100)}</td><td class="num">${money(a[a.length-1].principal)}</td><td class="num">${times(mm.stressDSCR)}</td></tr>`;}).join('')}</tbody></table></div><p class="tiny muted">A bullet structure can show stronger near-term coverage while concentrating principal at maturity. Affordability must include that balloon and refinancing risk.</p>${button('Download full repayment schedule','scheduleCSV')}</section>`;}
function covValues(){const f=latest(),m=model();return[{name:'Debt service coverage',actual:ratio(f.cfads,f.debtService),forecast:m.stressDSCR,limit:S.cov.dscr,min:true,note:'Forecast uses cash-timing-adjusted scenario coverage. Reconcile with contractual CFADS.'},{name:'Current ratio',actual:ratio(f.currentAssets,f.currentLiabilities),forecast:ratio(f.currentAssets-m.cashLoss12,f.currentLiabilities),limit:S.cov.current,min:true,note:'Sensitivity only: current assets reduced by 12-month net cash impact; liabilities unchanged.'},{name:'Debt to equity',actual:ratio(f.debt,f.equity),forecast:ratio(f.debt+S.company.requested,f.equity),limit:S.cov.de,min:false,note:'Pro forma at full draw; excludes scheduled principal amortisation and future equity changes.'}];}
function covenants(){return head('Monitor','Know the headroom before the testing date.','Separate reported ratios, scenario sensitivities and formally verified covenant tests.')+`<section class="card"><div class="row between"><h2>Covenant headroom</h2><span class="tag ${S.cov.confirmed?'green':'amber'}">${S.cov.confirmed?'USER-CONFIRMED TERMS':'ILLUSTRATIVE / UNCONFIRMED'}</span></div><div class="tablewrap"><table><thead><tr><th>Measure</th><th>Threshold</th><th>Reported actual</th><th>Scenario / pro forma</th><th>Headroom</th><th>Review flag</th></tr></thead><tbody>${covValues().map(c=>{const room=c.forecast===null?null:(c.min?c.forecast-c.limit:c.limit-c.forecast);return `<tr><td><strong>${c.name}</strong><p class="tiny muted">${c.note}</p></td><td>${c.min?'Minimum':'Maximum'} ${times(c.limit)}</td><td>${times(c.actual)}</td><td>${times(c.forecast)}</td><td>${times(room)}</td><td><span class="tag ${room===null?'amber':room<0?'red':'green'}">${room===null?'Cannot calculate':room<0?'Potential pressure':'Within sensitivity limit'}</span></td></tr>`;}).join('')}</tbody></table></div><p class="small">Next testing date: <strong>${E(S.cov.testDate)}</strong> · Financials as of <strong>${E(latest().asof)}</strong>.</p><p class="tiny muted">No sensitivity result establishes a contractual breach. Approved adjustments, borrower scope, dates, grace periods and waivers need human verification.</p></section><section class="card"><h2>Confirm the agreed definitions</h2><form id="covForm"><fieldset><div class="forms">${field('Minimum debt service coverage','dscr',S.cov.dscr,'number','required min="0" max="100" step="0.01"')}${field('Minimum current ratio','current',S.cov.current,'number','required min="0" max="100" step="0.01"')}${field('Maximum debt to equity','de',S.cov.de,'number','required min="0" max="100" step="0.01"')}${field('Next testing date','testDate',S.cov.testDate,'date','required')}${textarea('Borrower scope, formula definitions and agreed adjustments','definition',S.cov.definition,'required maxlength="3000"')}</div><label class="check"><input type="checkbox" name="confirmed" ${S.cov.confirmed?'checked':''}>I have checked these terms against the relevant agreement or clearly labelled proposed term sheet.</label><button class="primary">Save covenant terms</button></fieldset></form></section>`;}
function unresolved(){let a=[];if(!S.confirmed)a.push('Financial inputs have not been confirmed.');checklist().filter(c=>!c.done).forEach(c=>{if(c.key!=='financials')a.push(c.label+'.');});if(Math.abs(S.company.requested-gap())>1)a.push('Proposed new amount differs from the calculated funding gap.');if(!S.cov.confirmed)a.push('Covenant definitions and thresholds remain unconfirmed or proposed.');if(S.events.some(e=>e.status==='Unreviewed'))a.push('External events await relevance review.');if(S.mode==='Illustrative dataset')a.push('Company, financials and starter counterparties are illustrative.');if(S.events.some(e=>e.illustrative))a.push('The event queue contains illustrative events.');if(latest().equity<=0)a.push('Non-positive equity makes debt-to-equity unsuitable.');return a;}
function pack(){const m=model();return{title:'IDEAL Lens financing review pack',generated:new Date().toISOString(),disclaimer:'Academic prototype. Local export only. No submission to DBS. All terms indicative.',dataset:S.mode,company:S.company,status:S.status,terms:S.terms,financials:S.financials,financialsConfirmed:S.confirmed,checklist:checklist(),dependencies:S.deps,events:S.events,scenarioAssumptions:S.scenario,scenarioResults:{baselineCoverage:m.baseDSCR,scenarioCashCoverage:m.stressDSCR,minCash:m.minCash,netCashImpact12:m.cashLoss12,monthlyBaseline:m.base,monthlyStress:m.stress},covenants:S.cov,covenantSensitivity:covValues(),unresolved:unresolved(),audit:S.audit};}
function review(){const issues=unresolved(),m=model();return head('Human review','One pack. A traceable financing conversation.','Compile verified inputs, scenarios and open questions. Company review is distinct from bank credit approval.')+`<div class="grid equal"><section class="card"><h2>Review summary</h2><p><strong>${E(S.company.name)}</strong></p><p class="small">${E(S.company.purpose)}</p><div class="divider"></div><p class="small">Proposed amount <strong>${money(S.company.requested)}</strong><br>Structure <strong>${E(S.terms.product)}</strong><br>Tenor <strong>${S.terms.years} years</strong> · rate assumption <strong>${S.terms.rate}%</strong><br>Scenario cash coverage <strong>${times(m.stressDSCR)}</strong></p><span class="tag red">${E(S.status)}</span><div class="actionbar">${button('Export review pack · JSON','packJSON',true)}${button('Print / save as PDF','print')}</div></section><section class="card"><h2>Unresolved questions</h2>${issues.length?`<ul class="list small">${issues.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:'<p class="small positive">Readiness items complete. Credit and legal review are still required.</p>'}<p class="tiny muted">No automated approval, waiver, sanction decision or repricing is performed.</p></section></div><section class="card" style="margin-top:20px"><h2>Company review workflow</h2><div class="steps"><div class="done">Prepare</div><div class="${S.status!=='Draft'?'done':''}">Company checker</div><div class="${S.status==='Company reviewed'||S.status==='RM review requested (demo)'?'done':''}">Reviewed pack</div><div class="${S.status==='RM review requested (demo)'?'done':''}">RM conversation</div></div><p class="small">Finance manager prepares → Company approver reviews → Finance manager marks an RM review request. Roles are a demonstration switch, not secure authentication. No external transmission occurs.</p><div class="row">${button('Request company review','requestReview')}${button('Confirm company review','approveReview')}${button('Return for more information','returnReview')}${button('Mark RM review requested','requestRM',true)}</div></section><section class="card"><h2>Recent activity</h2><div class="tablewrap"><table class="audit"><thead><tr><th>Time</th><th>Actor</th><th>Action</th></tr></thead><tbody>${S.audit.slice(0,15).map(a=>`<tr><td>${E(a.time)}</td><td>${E(a.actor)}</td><td>${E(a.action)}</td></tr>`).join('')||'<tr><td colspan="3">No changes recorded yet.</td></tr>'}</tbody></table></div><p class="tiny muted">Local activity history is editable browser data, not a tamper-proof bank audit trail.</p></section>`;}
function about(){return head('Controls & feasibility','A working base with honest boundaries.','Use this workspace to demonstrate the customer journey, evidence and decision logic.')+`<div class="help-grid"><section class="card"><h2>Working in this single file</h2><ul class="list small"><li>Application and funding-gap calculations.</li><li>Three-period financial entry, CSV import and text parsing.</li><li>Supplier/customer declarations and evidence review.</li><li>Varied scenarios and full repayment schedules.</li><li>Liquidity, coverage and covenant sensitivities.</li><li>Company maker-checker demonstration.</li><li>Local saving, backups and exported review packs.</li></ul></section><section class="card"><h2>Production integrations still required</h2><ul class="list small"><li>Licensed news and announcement feeds with background jobs.</li><li>AI extraction with source-page references and uncertainty.</li><li>Entity resolution and relevance models with validation.</li><li>Secure DBS/ERP data connections with customer consent.</li><li>Server-side identity, entitlements and approval controls.</li><li>Encrypted storage, retention controls and immutable audit.</li></ul></section></div><section class="card"><h2>Why AI belongs in the proposed product</h2><p class="small">AI can interpret varied announcements, resolve company and subsidiary names, connect the affected operation to a declared dependency and produce grounded explanations. Financial arithmetic should remain deterministic. The base shows the downstream workflow using manually selected evidence; it does not pretend a rules-based demo is live AI.</p><h3>Governance and ethical controls</h3><p class="small">Verify sources and entity matches, monitor false alarms and missing coverage, protect confidential dependency data, retain human review, and avoid unsupported default predictions. Do not use another bank customer's private data without authority. Borrower declarations need periodic refresh.</p><h3>Suggested pilot measures</h3><p class="small">Measure event relevance precision on labelled examples, time spent preparing a review, document follow-ups, financial calculation accuracy and actionable warnings. Establish a baseline before claiming any improvement percentage.</p><h3>Data freshness</h3><p class="small">Financial as-of date: ${E(latest().asof)}. Sources are user supplied. A recent upload date does not make an old financial period current. No-news coverage is not low risk.</p></section><section class="card"><h2>Workspace management</h2><p class="small">Data stays in this browser's local storage. For public demos, use sample or authorised non-sensitive information. Back up before clearing browser data. Reference file contents are not included in exports.</p><div class="row">${button('Export workspace','backup')}${button('Restore exported workspace','restore')}${button('Reset to starter dataset','reset')}</div><p class="tiny muted">Restore accepts only this prototype's version 1 JSON format. Reset requires confirmation.</p></section>`;}
function updateScenarioFields(){const f=document.getElementById('scenarioForm');if(!f||!f.elements)return;const groups={'Supplier disruption':['weeks','inventory','replacement','recovery','revenueShare','margin'],'Customer payment delay':['invoice','days'],'Cost increase':['cost'],'No shock':[]};const active=groups[f.elements.type.value]||[];for(const key of ['weeks','inventory','replacement','recovery','revenueShare','margin','invoice','days','cost']){const input=f.elements[key];input.closest('.field').hidden=!active.includes(key);input.disabled=!active.includes(key);}}
function render(){document.getElementById('nav').innerHTML=NAV.map(([p,n,l])=>`<button class="nav ${p===page?'active':''}" data-action="go:${p}" ${p===page?'aria-current="page"':''}><i>${n}</i>${l}</button>`).join('');document.getElementById('companyLabel').textContent=S.company.name;document.getElementById('companyMeta').textContent=S.mode+' · '+S.company.country+' · SGD';document.getElementById('role').value=S.role;document.getElementById('content').innerHTML=({overview,application,documents,financials,dependencies,intelligence,scenarios,covenants,review,about}[page]||overview)();updateScenarioFields();if(S.role==='Viewer')document.querySelectorAll('#content fieldset').forEach(f=>f.disabled=true);if(!storageOK)document.getElementById('content').insertAdjacentHTML('afterbegin','<div class="notice">Local saving is unavailable. Export your workspace before leaving.</div>');}

function numeric(data,keys){keys.forEach(k=>{data[k]=num(data[k]);});return data;}
function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function csvEncode(rows){return rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function csvParse(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(q)throw Error('Unclosed CSV quote.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
const CSVKEYS=['year',...Object.keys(FIELDS),'source','page','asof'];
function importFinancialCSV(text){const rows=csvParse(text);if(rows.length!==4)throw Error('Use the template with exactly three financial rows.');const header=rows.shift().map(x=>x.trim());if(new Set(header).size!==header.length||CSVKEYS.some(k=>!header.includes(k)))throw Error('Missing or duplicate template headers.');const result=rows.map(row=>{if(row.length!==header.length)throw Error('Each row must have the same number of columns as the header.');const f={};CSVKEYS.forEach(k=>f[k]=row[header.indexOf(k)].trim());Object.keys(FIELDS).forEach(k=>{if(f[k]===''||!Number.isFinite(Number(f[k])))throw Error('Invalid plain numeric amount for '+k);f[k]=Number(f[k]);});checkFinancial(f);return f;});if(new Set(result.map(f=>f.year)).size!==3)throw Error('Reporting periods must be unique.');return result.sort((a,b)=>Number(a.year)-Number(b.year));}
function checkFinancial(f){if(!/^\d{4}$/.test(String(f.year))||!f.source||!/^\d{4}-\d{2}-\d{2}$/.test(f.asof)||!Number.isFinite(Date.parse(f.asof)))throw Error('A four-digit year, source and valid ISO as-of date are required.');Object.keys(FIELDS).forEach(k=>{if(typeof f[k]!=='number'||!Number.isFinite(f[k])||Math.abs(f[k])>1e12)throw Error('Invalid financial amount: '+k);if(!['netIncome','cfo','cfads','equity','ebitda','grossProfit'].includes(k)&&f[k]<0)throw Error('Negative amount is not allowed for '+k);});if(f.inventory>f.currentAssets)throw Error('Inventory cannot exceed current assets.');if(f.cash>f.currentAssets)throw Error('Reported cash cannot exceed current assets.');if(f.receivables>f.currentAssets)throw Error('Receivables cannot exceed current assets.');}
function validateWorkspace(x){const fail=()=>{throw Error('Invalid workspace format. Restore a version 1 export from this prototype.');};if(!x||x.version!==1||!x.company||!x.terms||!x.scenario||!x.cov||!Array.isArray(x.financials)||x.financials.length!==3||!Array.isArray(x.deps)||x.deps.length>100||!Array.isArray(x.events)||x.events.length>500)fail();const base=seed();for(const [k,v]of Object.entries(base.company)){if(typeof v==='number'&&(typeof x.company[k]!=='number'||!Number.isFinite(x.company[k])||x.company[k]<0||x.company[k]>1e12))fail();if(typeof v==='string'&&typeof x.company[k]!=='string')fail();}x.financials.forEach(checkFinancial);x.financials.sort((a,b)=>Number(a.year)-Number(b.year));if(new Set(x.financials.map(f=>f.year)).size!==3)fail();for(const [obj,ref]of [[x.terms,base.terms],[x.scenario,base.scenario],[x.cov,base.cov],[x.benchmark,base.benchmark]]){if(!obj)fail();for(const [k,v]of Object.entries(ref)){if(typeof v==='number'&&(typeof obj[k]!=='number'||!Number.isFinite(obj[k])||obj[k]<0||obj[k]>1e12))fail();if(typeof v==='string'&&typeof obj[k]!=='string')fail();}}if(x.terms.years<1||x.terms.years>15||x.terms.rate>30||x.terms.grace>=x.terms.years*12||x.terms.fee>10)fail();if(!['Amortising term loan','Equal principal term loan','Revolving / bullet facility'].includes(x.terms.product))fail();for(const k of ['replacement','recovery','revenueShare','margin'])if(x.scenario[k]>100)fail();if(!['Supplier disruption','Customer payment delay','Cost increase','No shock'].includes(x.scenario.type))fail();if(!['Illustrative dataset','User-provided company data'].includes(x.mode))fail();if(x.scenario.weeks>104||x.scenario.inventory>104||x.scenario.days>730)fail();const ids=new Set();x.deps.forEach(d=>{if(!d.id||ids.has(d.id)||!['Supplier','Customer'].includes(d.kind)||!d.name||!d.item)fail();ids.add(d.id);for(const k of ['share','inventory','alternatives','terms'])if(typeof d[k]!=='number'||!Number.isFinite(d[k])||d[k]<0)fail();if(d.share>100||d.inventory>104||d.alternatives>104||d.terms>730)fail();});const eventIds=new Set();x.events.forEach(e=>{if(!e.id||eventIds.has(e.id)||!ids.has(e.dep)||!['Supplier disruption','Customer payment delay','Cost increase','Corporate action'].includes(e.type)||!e.title||!['Unreviewed','Relevant','Dismissed'].includes(e.status))fail();eventIds.add(e.id);for(const k of ['weeks','days','cost'])if(typeof e[k]!=='number'||!Number.isFinite(e[k])||e[k]<0||e[k]>1e12)fail();});x.role=['Finance manager','Company approver','Viewer'].includes(x.role)?x.role:'Finance manager';x.docs=Array.isArray(x.docs)?x.docs.slice(0,100):[];x.checks=x.checks||{};x.audit=Array.isArray(x.audit)?x.audit.slice(0,200):[];x.status=['Draft','Pending company review','Company reviewed','More information required','RM review requested (demo)'].includes(x.status)?x.status:'Draft';return x;}
document.addEventListener('submit',event=>{const form=event.target;if(!form.id)return;event.preventDefault();if(!canEdit()||!form.reportValidity())return;const d=form.id==='scenarioForm'?{...S.scenario,...formData(form)}:formData(form);try{switch(form.id){case'applicationForm':numeric(d,['project','equityFunding','availableFacility','requested']);S.mode=d.mode;delete d.mode;d.currency='SGD';d.facilityConfirmed=form.elements.facilityConfirmed.checked;S.company=d;changed('Updated company, project and funding sources');break;
case'financialForm':numeric(d,Object.keys(FIELDS));d.page=d.sourcePage;delete d.sourcePage;checkFinancial(d);if(S.financials.some((f,i)=>i!==finIndex&&f.year===d.year))throw Error('Use a unique reporting period.');S.financials[finIndex]=d;S.financials.sort((a,b)=>Number(a.year)-Number(b.year));finIndex=S.financials.findIndex(f=>f.year===d.year);S.confirmed=false;changed('Updated financial period '+d.year+'; source '+d.source);break;
case'benchmarkForm':numeric(d,['gross','current','de']);S.benchmark=d;changed('Updated peer reference assumptions');break;
case'checksForm':S.checks={debt:form.elements.debt.checked,project:form.elements.project.checked,ownership:form.elements.ownership.checked};changed('Updated readiness checklist');break;
case'depForm':numeric(d,['share','inventory','alternatives','terms']);d.id=editDep||id();d.confirmed=form.elements.confirmed.checked;if(!d.name.trim()||!d.item.trim())throw Error('Enter a legal name and dependency.');if(editDep)S.deps=S.deps.map(x=>x.id===editDep?d:x);else S.deps.push(d);editDep=null;changed('Saved declared relationship '+d.name);break;
case'eventForm':numeric(d,['weeks','days','cost']);if(!S.deps.some(x=>x.id===d.dep))throw Error('Select a declared counterparty.');if(d.url&&!safeURL(d.url))throw Error('Use an http or https source URL.');if(d.date>today())throw Error('Publication date cannot be in the future.');d.id=id();d.status='Unreviewed';d.illustrative=false;S.events.unshift(d);changed('Added user-supplied evidence '+d.title);break;
case'scenarioForm':numeric(d,['years','rate','grace','fee','requested','openingCash','weeks','inventory','replacement','recovery','revenueShare','margin','invoice','days','cost']);if(d.grace>=d.years*12)throw Error('Grace period must be shorter than the loan tenor.');S.company.requested=d.requested;S.terms={product:d.product,years:d.years,rate:d.rate,grace:d.grace,fee:d.fee};S.scenario={...S.scenario,...Object.fromEntries(['type','openingCash','weeks','inventory','replacement','recovery','revenueShare','margin','invoice','days','cost'].map(k=>[k,d[k]]))};changed('Recalculated financing and '+d.type+' scenario');break;
case'covForm':numeric(d,['dscr','current','de']);d.confirmed=form.elements.confirmed.checked;S.cov=d;changed('Updated covenant definitions and testing date');break;
case'textForm':{const entries=d.text.split(/\r?\n/).filter(l=>l.trim());const changes={},seen=new Set();for(const line of entries){const match=line.match(/^\s*([A-Za-z]+)\s*:\s*(-?[\d,]+(?:\.\d+)?)\s*$/);if(!match||!(match[1]in FIELDS))throw Error('Use recognised key: number lines only. No units or currency symbols.');if(seen.has(match[1]))throw Error('Duplicate field '+match[1]);seen.add(match[1]);const value=Number(match[2].replace(/,/g,''));if(!Number.isFinite(value))throw Error('Invalid number.');changes[match[1]]=value;}if(!seen.size)throw Error('No recognised fields found.');const candidate={...latest(),...changes,source:d.source,page:d.sourcePage,asof:today()};checkFinancial(candidate);S.financials[2]=candidate;S.confirmed=false;changed('Parsed '+seen.size+' structured text fields for latest period; manual verification required');break;}
}}catch(error){toast(error.message);}});
document.addEventListener('change',async event=>{const target=event.target;try{if(target.name==='type'&&target.closest('#scenarioForm')){updateScenarioFields();return;}if(target.id==='role'){S.role=target.value;audit('Switched demonstration role');persist();render();return;}if(target.id==='finPeriod'){finIndex=Number(target.value);render();return;}if(target.id==='docFiles'){if(!canEdit())return;for(const f of target.files){if(S.docs.length>=100)throw Error('Maximum 100 reference files.');S.docs.push({id:id(),name:f.name,size:f.size,added:today()});}changed('Recorded supporting reference file metadata');}if(target.id==='csvFile'){if(!canEdit())return;const f=target.files[0];if(!f)return;if(f.size>2000000)throw Error('CSV must be smaller than 2 MB.');const result=importFinancialCSV(await f.text());S.financials=result;S.confirmed=false;changed('Imported three financial periods from CSV');}if(target.id==='restoreFile'){if(!canEdit())return;const f=target.files[0];if(!f)return;if(f.size>2000000)throw Error('Workspace must be smaller than 2 MB.');const restored=validateWorkspace(JSON.parse(await f.text()));if(!confirm('Replace the current workspace with this exported data? Export your current workspace first if needed.'))return;S=restored;page='overview';editDep=null;finIndex=2;audit('Restored exported workspace');persist();render();toast('Workspace restored.');}}catch(error){toast(error.message);}finally{if(target.type==='file')target.value='';}});
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const [action,...parts]=b.dataset.action.split(':');const value=parts.join(':');if(action==='go'){page=value;editDep=null;render();window.scrollTo({top:0,behavior:'smooth'});return;}if(action==='backup'){download('ideal-lens-workspace.json',JSON.stringify(S,null,2));return;}if(action==='packJSON'){download('ideal-lens-review-pack.json',JSON.stringify(pack(),null,2));return;}if(action==='print'){preparePrint();window.print();return;}if(action==='template'){const starter=seed().financials;download('financial-template.csv',csvEncode([CSVKEYS,...starter.map(f=>CSVKEYS.map(k=>f[k]))]),'text/csv');return;}if(action==='scheduleCSV'){download('repayment-schedule.csv',csvEncode([['month','principal_SGD','interest_SGD','payment_SGD','balance_SGD'],...loan().map(r=>[r.month,r.principal.toFixed(2),r.interest.toFixed(2),r.payment.toFixed(2),r.balance.toFixed(2)])]),'text/csv');return;}if(!canEdit())return;switch(action){case'restore':document.getElementById('restoreFile').click();return;case'importCSV':document.getElementById('csvFile').click();return;case'confirmFinancials':S.financials.forEach(checkFinancial);S.confirmed=true;changed('Confirmed financial source references and inputs');return;case'editDep':editDep=value;render();return;case'cancelDep':editDep=null;render();return;case'deleteDep':if(!confirm('Remove this dependency and its linked events?'))return;S.deps=S.deps.filter(d=>d.id!==value);S.events=S.events.filter(e=>e.dep!==value);if(editDep===value)editDep=null;changed('Removed dependency and linked events');return;case'removeDoc':S.docs=S.docs.filter(d=>d.id!==value);changed('Removed reference file metadata');return;case'deleteEvent':S.events=S.events.filter(e=>e.id!==value);changed('Removed an event');return;case'relevant':case'dismiss':{const e=S.events.find(e=>e.id===value);if(!e)return;e.status=action==='relevant'?'Relevant':'Dismissed';changed('Set event '+e.title+' to '+e.status);return;}case'useEvent':{const e=S.events.find(e=>e.id===value);if(!e)return;if(e.type==='Corporate action'){toast('Assess the contractual consequence first. A corporate action is not automatically a negative cash shock.');return;}const d=S.deps.find(d=>d.id===e.dep);S.scenario={...S.scenario,event:e.id,type:e.type,weeks:e.weeks,inventory:d?.inventory??0,days:e.days,cost:e.cost};audit('Loaded event assumptions into scenario; revenue exposure requires user confirmation');persist();page='scenarios';render();toast('Event assumptions loaded. Confirm revenue exposure, invoice value and mitigation inputs.');return;}case'addDemoEvents':{if(!S.deps.length){toast('Declare a supplier or customer first.');return;}const types=['Supplier disruption','Customer payment delay','Cost increase','Corporate action'];types.forEach((type,i)=>{const dep=S.deps.find(d=>d.kind===(type==='Customer payment delay'?'Customer':'Supplier'))||S.deps[0];S.events.push({id:id(),dep:dep.id,type,title:['Sample two-week shipment delay','Sample 60-day invoice delay','Sample compliance equipment cost','Sample counterparty acquisition'][i],text:['Illustrative evidence: shipments from the declared operation may be delayed.','Illustrative evidence: payment on an affected invoice may arrive later.','Illustrative evidence: new requirements may add a one-off equipment cost.','Illustrative evidence: ownership changes; contract continuity requires checking.'][i],date:today(),source:'Fictional demonstration evidence',url:'',weeks:[2,4,8,0][i],days:[0,60,0,0][i],cost:[0,0,350000,0][i],status:'Unreviewed',illustrative:true});});changed('Added four varied illustrative events');return;}case'requestReview':if(S.role!=='Finance manager'){toast('The Finance manager prepares the company review request.');return;}if(checklist().some(c=>!c.done)){toast('Complete the five readiness items before requesting company review.');return;}S.status='Pending company review';audit('Requested company checker review');break;case'approveReview':if(S.role!=='Company approver'||S.status!=='Pending company review'){toast('Switch to Company approver after a Finance manager requests review.');return;}S.status='Company reviewed';audit('Company checker reviewed pack; no bank approval');break;case'returnReview':if(S.role!=='Company approver'||S.status!=='Pending company review'){toast('Only the Company approver can return a pending review.');return;}S.status='More information required';audit('Company checker requested more information');break;case'requestRM':if(S.role!=='Finance manager'||S.status!=='Company reviewed'){toast('Company review must be complete, then switch to Finance manager.');return;}S.status='RM review requested (demo)';audit('Marked RM review request; no external submission');break;case'reset':if(!confirm('Reset all local inputs to the illustrative starter dataset? This replaces current entries.'))return;S=seed();page='overview';editDep=null;finIndex=2;audit('Reset to illustrative starter dataset');break;default:return;}persist();render();toast('Workflow updated locally. No information sent to DBS.');});
function preparePrint(){const p=pack(),m=p.scenarioResults;document.getElementById('printArea').innerHTML=`<h1>IDEAL Lens financing review pack</h1><p>Academic demonstration · ${E(p.generated)} · ${E(S.mode)}</p><h2>${E(S.company.name)}</h2><p>${E(S.company.purpose)}</p><p>Proposed borrowing ${money(S.company.requested)} · ${E(S.terms.product)} · ${S.terms.years} years · assumed rate ${S.terms.rate}%</p><h2>Financial source records</h2>${S.financials.map(f=>`<p>${E(f.year)}: ${E(f.source)} · page/section ${E(f.page)} · as of ${E(f.asof)} · revenue ${money(f.revenue)} · CFADS ${money(f.cfads)}</p>`).join('')}<h2>Dependencies</h2>${S.deps.map(d=>`<p>${E(d.name)} · ${E(d.kind)} · ${E(d.item)} · ${d.share}% concentration · ${d.confirmed?'confirmed':'unconfirmed'}</p>`).join('')}<h2>Evidence queue</h2>${S.events.map(e=>`<p><strong>${E(e.title)}</strong> · ${E(e.date)} · ${E(e.status)} · ${e.illustrative?'illustrative':'user supplied'}<br>${E(e.text)}<br>Source: ${E(e.source)} ${E(e.url)}</p>`).join('')}<h2>Scenario assumptions</h2><pre>${E(JSON.stringify(S.scenario,null,2))}</pre><p>Baseline coverage ${times(m.baselineCoverage)} · scenario cash coverage ${times(m.scenarioCashCoverage)} · minimum cash ${money(m.minCash)} · net 12-month cash impact ${money(m.netCashImpact12)}</p><h2>Covenant sensitivities</h2>${covValues().map(c=>`<p>${c.name}: ${times(c.forecast)} against ${c.min?'minimum':'maximum'} ${times(c.limit)}. ${E(c.note)}</p>`).join('')}<h2>Open questions</h2><ul>${unresolved().map(i=>`<li>${E(i)}</li>`).join('')}</ul><h2>Limitations</h2><p>Indicative scenario analysis only. Annual inputs distributed monthly; no seasonality or calibrated event probabilities. Contractual covenant calculations require verification. No live AI, news feed, authentication or bank connection. No bank approval or submission.</p><h2>Recent activity</h2>${S.audit.slice(0,20).map(a=>`<p>${E(a.time)} · ${E(a.actor)} · ${E(a.action)}</p>`).join('')}`;}
render();if(loadMessage)toast(loadMessage);
</script>
